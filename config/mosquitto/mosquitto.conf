# MQTT broker of the house (published ports: see docker-compose.yml).
# passwd and acl are NOT in git: `make secrets` writes both from .env. Users: home
# (the backend and your own nodes, everything) and z2m (zigbee2mqtt/# only).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
