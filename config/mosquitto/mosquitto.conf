# MQTT broker of the house (published ports: see docker-compose.yml).
# The accounts and what each may do live in dynamic-security.json, NOT in git: `make secrets`
# writes it from .env. Roles: backend (home: everything), zigbee2mqtt (z2m: zigbee2mqtt/# only),
# devices (MQTT_DEVICE_USERS: everything but publishing to MQTT_BACKEND_ONLY).
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
