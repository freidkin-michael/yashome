  const c = el('div','fav-card');
  c.id = `fav_${f.device}_${f.code}`;
  c.dataset.device = f.device;
  c.dataset.code = f.code;

  if(favDeleteMode){
    const key = `${f.device}/${f.code}`;
    c.classList.add('selectable');
    if(favSelected.has(key)) c.classList.add('selected');
    c.append(el('div','selmark', favSelected.has(key) ? '\u2713' : ''));
    c.append(el('div','alias', escapeHtml(f.alias || f.code)));
    if(!d) c.append(el('div','orphan',i18n('\u2014 device is gone \u2014')));
    c.onclick = ()=>{
      if(favSelected.has(key)) favSelected.delete(key); else favSelected.add(key);
      render();
    };
    return c;
  }

  if(!d){
    c.innerHTML = `<div class="alias">${i18n('\u2014 device is gone \u2014')}</div>`;
    return c;
  }
  if(favEditMode) c.classList.add('editing');

  const alias = el('div','alias', escapeHtml(f.alias));
  c.append(alias);

  const dot = el('div','bigdot');
  dot.id = `favdot_${f.device}_${f.code}`;
  c.append(dot);

  if(favEditMode){
    attachDragReorder(c);
  } else {
    const bright = brightForCode(d, f.code);
    if(bright){
      // dimmable: the CIRCLE fills yellow = brightness; tap=on/off,
      // swipe on the circle=brightness, long-press=editor.
      const fill = el('div','dotfill'); fill.id = `dotfill_${d.id}_${bright.code}`;
      dot.classList.add('dimdot'); dot.prepend(fill);
      const pc = el('div','dimpc'); pc.id = `dimpc_${d.id}_${bright.code}`;
      c.append(pc);
      attachDimmerDot(dot, d, bright,
        ()=> sendControl(f.device, f.code, !isOn(f.device, f.code)),
        ()=> openFavEditor(f));
    } else {
      attachLongPress(c, ()=> sendControl(f.device, f.code, !isOn(f.device, f.code)),
                         ()=> openFavEditor(f));
    }
  }
  return c;
}

// Drag a card to reorder. Strategy: lift the card with a transform that
// follows the pointer, highlight the drop-target under the pointer, swap DOM
// only on release. Avoids visual snapping during drag.
// selector = siblings to swap with; onDrop(parent) = persist the new order
// (default persists FAVORITES -- the original consumer of this drag).
function attachDragReorder(card, selector = '.fav-card', onDrop = null){
  let dragging = false;
  let pid = -1;
  let grabX = 0, grabY = 0;
  let dropTarget = null;
  let dropAfter = false;   // pointer right of the centre / below the target -- insert AFTER it

  const setDropTarget = t=>{
    if(dropTarget === t) return;
    dropTarget?.classList.remove('drop-target');
    dropTarget = t;
    dropTarget?.classList.add('drop-target');
  };

  // Missed the cards (grid holes, gaps, margins) -- snap to the geometrically
  // nearest one, otherwise a drop into the void is silently rolled back.
  const nearestCard = (x, y)=>{
    let best = null, bd = 150*150;   // no snapping beyond 150px
    for(const k of card.parentElement.children){
      if(k === card || !k.matches(selector)) continue;
      const r = k.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right);
      const dy = Math.max(r.top - y, 0, y - r.bottom);
      const d = dx*dx + dy*dy;
      if(d < bd){ bd = d; best = k; }
    }
    return best;
  };

  const onMove = (e)=>{
    if(!dragging || e.pointerId !== pid) return;
    e.preventDefault();
    card.style.transform = `translate(${e.clientX - grabX}px, ${e.clientY - grabY}px)`;
    card.style.visibility = 'hidden';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    card.style.visibility = '';
    let t = under?.closest(selector);
    if(!(t && t !== card && t.parentElement === card.parentElement)) t = null;
    if(!t) t = nearestCard(e.clientX, e.clientY);
    if(t){
      const r = t.getBoundingClientRect();
      dropAfter = e.clientY > r.bottom
               || (e.clientY >= r.top && e.clientX > r.left + r.width/2);
    }
    setDropTarget(t);
  };

  const finish = async (e)=>{
    if(!dragging || (e && e.pointerId !== pid)) return;
    dragging = false;
    resizing = false;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    card.classList.remove('dragging');
    card.style.transform = '';
    card.style.visibility = '';
    const t = dropTarget;
    setDropTarget(null);
    if(t){
      const parent = card.parentElement;
      if(dropAfter) parent.insertBefore(card, t.nextSibling);
      else          parent.insertBefore(card, t);
      if(onDrop){ onDrop(parent, {x: e && e.clientX, y: e && e.clientY}); return; }
      const newOrder = Array.from(parent.children)
        .map(c => ({device: c.dataset.device, code: c.dataset.code}))
        .filter(x => x.device);
      FAVORITES = newOrder
        .map(o => FAVORITES.find(f => f.device===o.device && f.code===o.code))
        .filter(Boolean);
      try{
        await api('/api/favorites/reorder', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({order: FAVORITES.map(f=>`${f.device}/${f.code}`)})
        });
      }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
    }
  };

  card.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true;
    resizing = true;   // freeze WS-driven repacking for the duration of the gesture
    pid = e.pointerId;
    grabX = e.clientX; grabY = e.clientY;
    card.classList.add('dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', finish);
    window.addEventListener('pointercancel', finish);
    e.preventDefault();
  });
}

// Long-press handler: short tap fires `onShort`; press held >550ms fires `onLong`
// (vibrates briefly on phones if supported)
function attachLongPress(elx, onShort, onLong){
  let timer = null;
  let fired = false;
  let startX = 0, startY = 0;
  const LONG_MS = 550;
  const start = (x, y) => {
    fired = false; startX = x; startY = y;
    timer = setTimeout(()=>{
      fired = true;
      try{ navigator.vibrate?.(30); }catch(e){}
      onLong();
    }, LONG_MS);
  };
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  const end = () => {
    if(timer){ clearTimeout(timer); timer = null; if(!fired) onShort(); }
  };
  elx.addEventListener('pointerdown', e => { start(e.clientX, e.clientY); });
  elx.addEventListener('pointerup',   e => { end(); });
  elx.addEventListener('pointercancel', cancel);
  elx.addEventListener('pointerleave',  cancel);
  elx.addEventListener('pointermove',   e => {
    if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) cancel();
  });
  elx.addEventListener('contextmenu', e => { e.preventDefault(); if(fired) return; cancel(); fired = true; onLong(); });
}

async function removeFav(f){
  try{
    await api(`/api/favorites/${encodeURIComponent(f.device)}/${encodeURIComponent(f.code)}`, {method:'DELETE'});

}

async function renameFav(f, newAlias){
  if(!newAlias || newAlias === f.alias) return;
  try{
    await api(`/api/favorites/${encodeURIComponent(f.device)}/${encodeURIComponent(f.code)}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({alias: newAlias})
    });
    f.alias = newAlias;
  }catch(e){ alert(i18n('Error: ')+e.message); render(); }
}

async function addFavorite(device, code, alias){
  try{
    const r = await api(`/api/favorites/${encodeURIComponent(device)}/${encodeURIComponent(code)}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({alias})
    });
    const existing = FAVORITES.findIndex(f => f.device===device && f.code===code);
    if(existing >= 0) FAVORITES[existing] = r.favorite;
    else FAVORITES.push(r.favorite);
  }catch(e){ alert(i18n('Error: ')+e.message); return false; }
  return true;
}

    </div>`;
  document.getElementById('bd').classList.add('show');
  document.body.style.overflow = 'hidden';
  openModalId = '__fav_editor__';

  let selected = {device: f.device, code: f.code};
  md.querySelectorAll('.picker-chan').forEach(btn=>{
    if(btn.classList.contains('exists')) return;
    btn.onclick = ()=>{
      md.querySelectorAll('.picker-chan').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cut = btn.dataset.key.lastIndexOf('/');   // a code never has a /
      const dev = btn.dataset.key.slice(0, cut), code = btn.dataset.key.slice(cut + 1);
      selected = {device: dev, code};
    };
  });
  md.querySelector('#fav-edit-cancel').onclick = ()=> closeModal();
  md.querySelector('#fav-edit-delete').onclick = async ()=>{
    if(!confirm(i18n('Remove from favourites?'))) return;
    await removeFav(f);
    closeModal();
  };
  md.querySelector('#fav-edit-save').onclick = async ()=>{
    const newAlias = md.querySelector('#fav-edit-alias').value.trim() || f.alias;
    const sourceChanged = (selected.device !== f.device || selected.code !== f.code);
    try{
      if(sourceChanged){
        // remove old, add new with new key (preserve position)
        const idx = FAVORITES.findIndex(x => x.device===f.device && x.code===f.code);
        await api(`/api/favorites/${encodeURIComponent(f.device)}/${encodeURIComponent(f.code)}`, {method:'DELETE'});
        const r = await api(`/api/favorites/${encodeURIComponent(selected.device)}/${encodeURIComponent(selected.code)}`, {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({alias: newAlias})
        });
        // splice into local list to preserve position, then reorder on server
        FAVORITES = FAVORITES.filter(x => !(x.device===f.device && x.code===f.code));
        if(idx >= 0){
          FAVORITES.splice(idx, 0, r.favorite);
          await api('/api/favorites/reorder', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({order: FAVORITES.map(x=>`${x.device}/${x.code}`)})
          });
        } else {
          FAVORITES.push(r.favorite);
        }
      } else if(newAlias !== f.alias){
        await renameFav(f, newAlias);
      }
      closeModal();
      renderTabs(); render();
    }catch(e){ alert(i18n('Error: ')+e.message); }
  };
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function el(tag, cls, html){
  const e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null) e.innerHTML=html; return e;
}

// Inline brightness slider shared by device cards and favorite tiles.
// Card and fav tabs never render at the same time, so reusing the same
// element id (br_<id>_<code>) is collision-free; syncBright() patches it.
function brightRow(d, b){
  const brow=el('div','brightrow');
  brow.innerHTML = `<span class="brlbl" style="font-size:12px;opacity:.75">${escapeHtml(b.label||b.code)}</span><input type="range" min="0" max="100" value="0"
      id="br_${escapeHtml(d.id)}_${escapeHtml(b.code)}"><span class="brpc" id="brpc_${escapeHtml(d.id)}_${escapeHtml(b.code)}">\u2014</span>`;
  brow.onclick = ev=>ev.stopPropagation();
  const sl = brow.querySelector('input');
  // keep slider drags from triggering the card's long-press / fav toggle
  ['pointerdown','pointerup','pointermove'].forEach(ev =>
    sl.addEventListener(ev, e => e.stopPropagation()));
  sl.oninput = ()=>{
    const pc=document.getElementById(`brpc_${d.id}_${b.code}`);
    if(pc) pc.textContent = sl.value+'%';
    pending[d.id+'/'+b.code] = {t:Date.now(), v:+sl.value};
  };
  sl.onchange = ()=>{ sendControl(d.id, b.code, +sl.value); };
  return brow;
}

// One gang of a multi-channel dimmer as a single group: button, bar, percent.
// Anonymous dots in one row plus a detached list of sliders below made it
// guesswork which slider drove which channel.
function dimGroupRow(d, s, b){
  const box = el('div','dimgroup');
  box.onclick = ev=>ev.stopPropagation();
  const row = el('div','brightrow');
  // Channel label sits outside the pill so a 2-gang card stays identifiable
  // ("1"/"Living room") without stealing room from the three in-pill zones.
  const lbl = el('span','brlbl');
  lbl.style.cssText = 'font-size:12px;opacity:.75';
  lbl.textContent = s.label || '';
  // The pill is a 3-zone rocker: tap left = dimmer, centre = on/off, right =
  // brighter; a drag anywhere sets the level by finger position. "-", the live
  // %, and "+" label the three zones. The yellow fill shows the real level and
  // its visibility is gated by .on (driven by the switch state), so an off
  // channel reads empty. The pill travel spans the channel's usable window
  // [floor, ceil]; the gear opens that window's editor.
  const dot = el('div','dot dimdot dimpill');
  dot.id = `sw_${d.id}_${s.code}`;
  dot.style.cssText = 'width:auto;min-width:104px;max-width:52%;height:34px;'
                    + 'padding:0 10px;border-radius:17px;font-size:13px;'
                    + 'justify-content:space-between;gap:6px;white-space:nowrap;'
                    + 'touch-action:none;cursor:pointer';
  const fill = el('div','dotfill');
  fill.id = `dotfill_${d.id}_${b.code}`;
  const minus = el('span','', '\u2212');
  minus.style.cssText = 'font-weight:700;opacity:.7';
  const pct = el('span','', '');
  pct.id = `dimpc_${d.id}_${b.code}`;               // setDimFill writes % here
  pct.style.cssText = 'font-weight:700;min-width:34px;text-align:center';
  const plus = el('span','', '+');
  plus.style.cssText = 'font-weight:700;opacity:.7';
  dot.append(fill, minus, pct, plus);
  if(isOn(d.id, s.code)) dot.classList.add('on');
  attachDimZones(dot, d, s, b);
  setDimFill(d, b, favLevel(d, b));                 // seed % + fill before first state push
  row.append(lbl, dot);
  box.append(row);
  return box;
}

// The group pill's gesture: a plain tap picks a zone (left third dims a step,
// centre toggles on/off, right third brightens a step), while any drag past a
// few px sets the level continuously by finger position along the width. Pointer
// capture follows the finger past the edge; only the centre tap can turn off.
//
// Stepping works on the tenth INDEX of the [floor, ceil] window and rounds to the
// nearest tenth, deliberately not floor/ceil: the lamp echoes back a level a
// point or two off what we sent (30 comes back as 29, 20 as 21), and flooring
// that echo recomputes the very same step, so +/- would sit there refusing to
// move. Rounding absorbs the drift, so every tap advances exactly one tenth.
function attachDimZones(dot, d, s, b){
  let pid = -1, startX = 0, moved = false;
  const posAt = x=>{
    const r = dot.getBoundingClientRect();
    return Math.max(0, Math.min(100, Math.round((x - r.left) / (r.width || 1) * 100)));
  };
  const previewUi = ui=>{
    pending[d.id+'/'+b.code] = {t:Date.now(), v:ui};
    setDimFill(d, b, ui);
  };
  dot.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    pid = e.pointerId; startX = e.clientX; moved = false;
    try{ dot.setPointerCapture(pid); }catch(_){}
  });
  dot.addEventListener('pointermove', e=>{
    if(e.pointerId !== pid) return;
    if(!moved && Math.abs(e.clientX - startX) > 6) moved = true;
    if(moved) previewUi(uiFromPos(b, posAt(e.clientX)));
  });
  dot.addEventListener('pointerup', e=>{
    if(e.pointerId !== pid) return;
    e.stopPropagation();
    try{ dot.releasePointerCapture(pid); }catch(_){}
    pid = -1;
    if(moved){                                   // a drag: send the positioned level
      sendControl(d.id, b.code, pending[d.id+'/'+b.code].v);
      if(!isOn(d.id, s.code)) sendControl(d.id, s.code, true);
      return;
    }
    const r = dot.getBoundingClientRect();
    const rel = (e.clientX - r.left) / (r.width || 1);
    if(rel >= 0.34 && rel <= 0.66){              // centre zone: on/off
      sendControl(d.id, s.code, !isOn(d.id, s.code));
      return;
    }
    const f = dimFloor(b), c = dimCeil(b), span = (c - f) || 1;
    let k = Math.round((favLevel(d, b) - f) / span * 10);   // nearest tenth, not floor
    k = Math.max(0, Math.min(10, k)) + (rel < 0.34 ? -1 : 1);
    k = Math.max(0, Math.min(10, k));
    const ui = Math.max(1, Math.min(100, Math.round(f + k * span / 10)));
    sendControl(d.id, b.code, ui);
    if(!isOn(d.id, s.code)) sendControl(d.id, s.code, true);
    previewUi(ui);
  });
  dot.addEventListener('pointercancel', ()=>{
    try{ dot.releasePointerCapture(pid); }catch(_){}
    pid = -1;
    delete pending[d.id+'/'+b.code];               // never sent: show the real level again
    setDimFill(d, b, favLevel(d, b));
  });
  dot.addEventListener('click', e=>e.stopPropagation());
}

function colorRow(d, c){
  const row = el('div','brightrow');
  const cur = (STATE[d.id] && STATE[d.id].values && STATE[d.id].values[c.code]) || c.default || '#00b0ff';
  row.innerHTML = `<span class="brlbl" style="font-size:12px;opacity:.75">${escapeHtml(c.label||i18n('Colour'))}</span>`;
  const inp = document.createElement('input');
  inp.type = 'color'; inp.id = `col_${d.id}_${c.code}`; inp.value = cur;
  inp.style.cssText = 'flex:1;min-width:0;height:28px;padding:0;border:0;background:none;cursor:pointer';
  ['pointerdown','pointerup','pointermove','click'].forEach(ev => inp.addEventListener(ev, e => e.stopPropagation()));
  inp.onchange = () => { sendControl(d.id, c.code, inp.value); };
  row.append(inp);
  row.onclick = ev => ev.stopPropagation();
  return row;
}

function syncBright(d, b, val){
  if(val==null) return;
  const p=pending[d.id+'/'+b.code];
  if(p && Date.now()-p.t < 4000) return;   // honour just-dragged value
  const span=(b.max-b.min)||1;
  const ui=Math.max(0,Math.min(100,Math.round((val-b.min)/span*100)));
  const sl=document.getElementById(`br_${d.id}_${b.code}`);   // extra card slider, if any
  if(sl){ sl.value=ui; const pc=document.getElementById(`brpc_${d.id}_${b.code}`); if(pc) pc.textContent=ui+'%'; }
  setDimFill(d, b, ui);                                       // circle fill (fav + card)
}

// Per-channel usable brightness window. The pill's 0..100 travel maps into
// [floor, ceil] (raw UI percent), because the LED wired to a gang may only light
// from ~15% and reach full by ~60%. Unset => full 0..100, i.e. identity.
function dimFloor(b){ return Math.max(0, Math.min(99, +b.floor||0)); }
function dimCeil(b){ const c=(b.ceil==null?100:+b.ceil); return Math.max(dimFloor(b)+1, Math.min(100, c)); }
function hasDimWindow(b){ return dimFloor(b)>0 || dimCeil(b)<100; }
function posFromUi(b, ui){ const f=dimFloor(b), c=dimCeil(b); return Math.max(0, Math.min(100, Math.round((ui-f)/(c-f)*100))); }
function uiFromPos(b, pos){ const f=dimFloor(b), c=dimCeil(b); return Math.max(1, Math.min(100, Math.round(f + pos/100*(c-f)))); }

// brightness level 0-100, honouring an in-flight drag
function favLevel(d, b){
  // a level the user just set wins for a moment (the device has not echoed it yet);
  // after that the reported level counts, or +/- would keep stepping from an old value
  const key=d.id+'/'+b.code, p=pending[key];
  if(p && Date.now()-p.t < 3000) return p.v;
  if(p) delete pending[key];
  const val=STATE[d.id]?.values?.[b.code];
  if(val==null) return 0;
  const span=(b.max-b.min)||1;
  return Math.max(0,Math.min(100,Math.round((val-b.min)/span*100)));
}

// fill the dimmer CIRCLE to the level; floor visual at 12% so 1% is clearly on.
// % shows as a small label below the circle. Fill opacity is gated by .on in CSS.
function setDimFill(d, b, lvl){
  // an ON light parked at the device floor brightness computes 0% -- show it
  // as 1% so the circle fills and the % label reads "on" instead of blank.
  if(lvl===0){
    const vals=STATE[d.id]?.values;
    // the switch on THIS gang, not simply the first one
    const sw=ctlForCode(d, b.code, 'switch') || controlsOf(d).switches[0];
    if(vals && sw && vals[sw.code]) lvl=1;
  }
  const fill=document.getElementById(`dotfill_${d.id}_${b.code}`);
  let disp = lvl;                    // what the % readout and pill width show
  if(fill){
    if(fill.parentElement && fill.parentElement.classList.contains('dimpill')){
      // horizontal pill: fills across its usable window, so a level at floor reads
      // 0% and at ceil reads 100% -- the whole travel is meaningful
      disp = hasDimWindow(b) ? posFromUi(b, lvl) : lvl;
      fill.style.width = (disp>0 ? disp : 0) + '%';
    } else {
      // round dot: floor the visual at 12% so 1% still reads as "on"
      fill.style.height = (lvl>0 ? Math.max(lvl,12) : 0) + '%';
    }
  }
  const pc=document.getElementById(`dimpc_${d.id}_${b.code}`);
  if(pc) pc.textContent = lvl>0 ? disp+'%' : '';
}

// Dimmer gesture on the round control: vertical swipe = brightness (min 1%),
// tap = toggle, long-press = optional (editor on fav tiles). Fixed sensitivity
// so the small circle is still easy to sweep; pointer capture follows the finger
// beyond the circle. stopPropagation keeps the card's modal-open quiet.
function attachDimmerDot(dot, d, b, toggleFn, longpressFn){
  let pid=-1, startY=0, startLvl=0, moved=false, lp=false, lpTimer=null;
  const SENS=160;   // px of vertical drag for a full 0->100 sweep
  dot.style.touchAction='none';
  const calc=y=>Math.max(1,Math.min(100,Math.round(startLvl + (startY-y)/SENS*100)));
  dot.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    pid=e.pointerId; startY=e.clientY; moved=false; lp=false;
    startLvl=favLevel(d,b)||1;
    try{ dot.setPointerCapture(pid); }catch(_){}
    if(longpressFn) lpTimer=setTimeout(()=>{ lp=true; longpressFn(); }, 600);
  });
  dot.addEventListener('pointermove', e=>{
    if(e.pointerId!==pid) return;
    if(!moved && Math.abs(startY-e.clientY)>6){ moved=true; clearTimeout(lpTimer); }
    if(moved){ const lvl=calc(e.clientY); pending[d.id+'/'+b.code]={t:Date.now(),v:lvl}; setDimFill(d,b,lvl); }
  });
  dot.addEventListener('pointerup', e=>{
    if(e.pointerId!==pid) return;
    e.stopPropagation(); clearTimeout(lpTimer);
    try{ dot.releasePointerCapture(pid); }catch(_){}
    pid=-1;
    if(lp) return;
    if(!moved && Math.abs(startY-e.clientY)>6){ const lvl=calc(e.clientY); pending[d.id+'/'+b.code]={t:Date.now(),v:lvl}; setDimFill(d,b,lvl); moved=true; }
    if(moved){ sendControl(d.id, b.code, pending[d.id+'/'+b.code].v); }
    else { toggleFn(); }
  });
  dot.addEventListener('pointercancel', ()=>{ clearTimeout(lpTimer); pid=-1; });
  dot.addEventListener('click', e=>e.stopPropagation());
}

// Gang suffix of a control code: 'state_l2' -> 'l2', 'brightness' -> ''.
function chanOf(code){
  for(const base of ['state','brightness'])
    if(String(code||'').startsWith(base))
      return String(code).slice(base.length).replace(/^_/,'');
  return '';
}

// The control of `kind` on the SAME gang as `code`. A multi-gang dimmer has one
// brightness per channel, so a favourite tile on gang 2 must not fill from gang
// 1's level. Returns null rather than a wrong channel.
function ctlForCode(d, code, kind){
  const list = (d.controls||[]).filter(c=>c.kind===kind);
  if(!list.length) return null;
  const want = chanOf(code);
  if(want) return list.find(c => chanOf(c.code) === want) || null;
  // Fall back to "the one obvious control" ONLY when there is nothing to confuse it
  // with. A card with two switches (power + backlight) used to pair BOTH with the
  // first slider, and rendered as a two-gang dimmer that drove one channel twice.
  const sw = (d.controls||[]).filter(c => c.kind === 'switch' && !c.card_toggle);
  return (list.length === 1 && sw.length === 1) ? list[0] : null;
}
function brightForCode(d, code){ return ctlForCode(d, code, 'bright'); }

function controlsOf(d){
  const k = type => d.controls.filter(c=>c.kind===type);
  return {
    switches: k('switch'),
    brights:  k('bright'),
    colors:   k('color'),
    sensors:  k('sensor'),
    sens_txt: k('sensor_text'),
    set_int:  k('setting_int'),
    set_enum: k('setting_enum'),
    set_bool: k('setting_bool'),
    trig_txt: k('trigger_text'),
  };
}

function autoVis(d){
  const auto = isOn(d.id,'auto');
  document.querySelectorAll(`.brightrow[data-dev="${CSS.escape(d.id)}"][data-when]`).forEach(r=>{
    r.style.display = ((r.dataset.when==='auto') === !!auto) ? '' : 'none';
  });
}

function card(d){
  const c=el('div','card'); c.id='c_'+d.id;
  const C = controlsOf(d);

  // top: name + meta
  c.append(el('div','name', escapeHtml(d.name)));

  // middle: info + sensors
  const info=el('div','info');
  const sens=el('div','sens');
  for(const s of C.sensors){
    sens.innerHTML += `<span id="sens_${escapeHtml(d.id)}_${escapeHtml(s.code)}">${escapeHtml(s.label||s.code)}: <b>\u2014</b>${escapeHtml(s.unit||'')}</span>`;
  }
  if(C.sensors.length) info.append(sens);
  // an unsupported device has no real controls -- say why instead of showing a
  // bare card the user cannot act on
  info.append(el('div','meta', d.unsupported
    ? `${escapeHtml(d.transport||'')} ${i18n('\u00b7 z2m did not recognise the model \u2014 nothing to control')}`
    : `${escapeHtml(catLabel(d.category))} \u00b7 ${escapeHtml(d.transport||'')}`));
  c.append(info);



  // bottom: switch dots with labels
  const row=el('div','switches'+(C.switches.length<=1?' center':''));
  // Fallback for a lone dimmable whose brightness can't be paired to its switch
  // by gang suffix -- it still gets the round swipe dot.
  const dimB = (C.switches.length===1 && C.brights.length===1) ? C.brights[0] : null;
  // Every switch paired with the brightness on its own gang renders as one group
  // row (oval 3-zone rocker + %). One channel or many -- same widget, so a single
  // dimmer looks and behaves exactly like a gang of a multi-channel one.
  const dimPairs = C.switches
    .filter(s => !s.card_toggle)
    .map(s => ({s, b: brightForCode(d, s.code)}))
    .filter(p => p.b);
  const grouped = dimPairs.length >= 1;
  const pairedSw = new Set(grouped ? dimPairs.map(p=>p.s.code) : []);
  const pairedBr = new Set(grouped ? dimPairs.map(p=>p.b.code) : []);
  if(C.switches.length){
    for(let i=0;i<C.switches.length;i++){
      const s=C.switches[i];
      if(s && s.card_toggle) continue;
      if(pairedSw.has(s.code)) continue;
      const wrap=el('div','dotwrap');
      const dot=el('div','dot');
      dot.id=`sw_${d.id}_${s.code}`;
      if(C.switches.length>1) dot.textContent = i+1;
      const lbl=el('div','dotlabel', escapeHtml(s.label || (C.switches.length>1?String(i+1):'')));
      lbl.id='swlbl_'+d.id+'_'+s.code;
      // caption = the state word: for the single unnamed toggle (On/Off)
      // and for any with text_on/text_off (a lock: Locked/Unlocked instead of a "Locked" caption under a dark dot)
      if((!s.label && C.switches.length===1) || s.text_on || s.text_off){
        lbl.dataset.state='1'; lbl.dataset.on = s.text_on || i18n('Switched on'); lbl.dataset.off = s.text_off || i18n('Switched off');
      }
      wrap.append(dot, lbl);
      if(i===0 && dimB){
        const fill=el('div','dotfill'); fill.id=`dotfill_${d.id}_${dimB.code}`;
        dot.classList.add('dimdot'); dot.prepend(fill);
        const pc=el('div','dimpc'); pc.id=`dimpc_${d.id}_${dimB.code}`;
        wrap.append(pc);
        attachDimmerDot(dot, d, dimB, ()=> sendControl(d.id, s.code, !isOn(d.id,s.code)));
      } else {
        wrap.onclick = ev=>{
          ev.stopPropagation();
          sendControl(d.id, s.code, !isOn(d.id,s.code));
        };
      }
      row.append(wrap);
    }
  } else if(!grouped){
    row.append(el('div','meta',i18n('\u2014 no switches \u2014')));
  }
  if(row.childElementCount) c.append(row);   // all channels grouped -> no dot row

  // sliders only for brightness controls not bound to a dimmer dot
  for(const cc of C.colors){ c.append(colorRow(d, cc)); }
  for(const s of C.switches.filter(x=>x.card_toggle)){
    const trow=el('div','brightrow'); trow.onclick=ev=>ev.stopPropagation();
    const lbl=el('span','brlbl'); lbl.style.cssText='font-size:12px;opacity:.75;flex:1'; lbl.textContent=s.label||s.code;
    const tg=el('div','toggle'); tg.id=`sw_${d.id}_${s.code}`;
    if(isOn(d.id,s.code)) tg.classList.add('on');
    tg.onclick=ev=>{ ev.stopPropagation(); const nv=!isOn(d.id,s.code); sendControl(d.id,s.code,nv); tg.classList.toggle('on',nv); autoVis(d); };
    trow.append(lbl,tg); c.append(trow);
  }
  for(const p of dimPairs){                  // one row per gang: dot, bar, %
    if(grouped) c.append(dimGroupRow(d, p.s, p.b));
  }
  for(const b of C.brights){
    if(b===dimB || pairedBr.has(b.code)) continue;
    const r=brightRow(d,b);
    if(b.when){ r.dataset.when=b.when; r.dataset.dev=d.id;
      r.style.display = ((b.when==="auto")===!!isOn(d.id,"auto")) ? "" : "none"; }
    c.append(r);
  }
  autoVis(d);

  // on-card enum: toggle "effects/static" + a dropdown to choose the effect
  for(const s of C.set_enum.filter(x=>x.on_card)){
    const OFFOPT = (s.off_option || 'Static');   // a device value, never translated
    const erow = el('div','enumrow');
    erow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:8px';
    erow.onclick = ev=>ev.stopPropagation();
    const lbl = el('span','', escapeHtml(s.label||s.code));
    lbl.style.cssText = 'font-size:12px;opacity:.75;min-width:52px';
    const tgl = el('div','toggle');
    tgl.id = `cet_${d.id}_${s.code}`;
    const sel = document.createElement('select');
    sel.id = `ces_${d.id}_${s.code}`;
    sel.style.cssText = 'flex:1;background:#1b2330;color:#dfe7f3;border:1px solid #2a3547;border-radius:8px;padding:6px 8px;font-size:13px';
    for(const opt of (s.range||[]).filter(o=>o!==OFFOPT)){
      const o = document.createElement('option');
      o.value = opt; o.textContent = (s.labels||{})[opt] || opt;
      sel.append(o);
    }
    tgl.onclick = ev=>{
      ev.stopPropagation();
      const on = tgl.classList.contains('on');
      sendControl(d.id, s.code, on ? OFFOPT : sel.value);
    };
    sel.onchange = ev=>{ ev.stopPropagation(); sendControl(d.id, s.code, sel.value); };
    ['pointerdown','pointerup','click'].forEach(e=>sel.addEventListener(e, ev=>ev.stopPropagation()));
    erow.append(lbl, tgl, sel);
    c.append(erow);
  }

  // event flash dot (buttons and remotes)
  if(d.category === 'button' || d.controls.some(x=>x.kind==='trigger_text')){
    c.append(el('div','eventdot'));
  }

  c.onclick = ()=> openModal(d.id);
  return c;
}

function isOn(id, code){
  const st = STATE[id]; if(!st || !st.online) return false;
  return !!st.values?.[code];
}

function updateCards(){
  // fav-dots
  for(const f of FAVORITES){
    const dot = document.getElementById(`favdot_${f.device}_${f.code}`);
    if(!dot) continue;
    const st = STATE[f.device];
    const fc = document.getElementById(`fav_${f.device}_${f.code}`);
    if(!st || !st.online){
      if(fc) fc.classList.add('offline');
      dot.classList.remove('on');
      continue;
    }
    if(fc) fc.classList.remove('offline');
    const on = !!st.values?.[f.code];
    dot.classList.toggle('on', on);
    if(fc) fc.classList.toggle('on', on);
    const dd = BY_ID[f.device];
    if(dd) for(const b of controlsOf(dd).brights)
      syncBright(dd, b, st.values?.[b.code]);
  }
  for(const d of DEVICES){
    const card=document.getElementById('c_'+d.id);
    if(!card) continue;
    const st=STATE[d.id];
    if(!st){ card.classList.add('offline'); continue; }
    card.classList.toggle('offline', !st.online);
    if(!st.online) continue;

    const v=st.values||{};
    let anyOn=false;
    for(const ctl of d.controls){
      const val=v[ctl.code];
      if(ctl.kind==='switch'){
        const dot=document.getElementById(`sw_${d.id}_${ctl.code}`);
        if(dot) dot.classList.toggle('on', !!val);
        const swl=document.getElementById(`swlbl_${d.id}_${ctl.code}`);
        if(swl && swl.dataset.state) swl.textContent = val ? swl.dataset.on : swl.dataset.off;
        if(val) anyOn=true;
      }
      if(ctl.kind==='sensor'){
        const cell=document.getElementById(`sens_${d.id}_${ctl.code}`);
        if(cell) cell.querySelector('b').textContent =
          val==null ? '\u2014' : (typeof val==='boolean' ? (val?i18n('yes'):i18n('no')) : val);
      }
      if(ctl.kind==='bright') syncBright(d, ctl, val);
      if(ctl.kind==='setting_enum' && ctl.on_card){
        const OFFOPT = (ctl.off_option || 'Static');
        const tgl=document.getElementById(`cet_${d.id}_${ctl.code}`);
        const sel=document.getElementById(`ces_${d.id}_${ctl.code}`);
        const active = val!=null && val!==OFFOPT;
        if(tgl) tgl.classList.toggle('on', active);
        if(sel && active && document.activeElement!==sel) sel.value = val;
      }
    }
    card.classList.toggle('any-on', anyOn);

    // event flash for button devices
    if(st.last_event_ts){
      const ageMs = Date.now() - st.last_event_ts*1000;
      card.classList.toggle('eventflash', ageMs < 30000);
    } else {
      card.classList.remove('eventflash');
    }
  }
}

// ---------- Modal ----------
function openModal(id){
  openModalId = id;
  _modalLastEventTs = 0;
  buildModal();
  document.getElementById('bd').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  if(openModalId === '__zigbee_pair__') stopZigbeePair();
  openModalId = null;
  if(_focusBeforeModal && document.body.contains(_focusBeforeModal)) _focusBeforeModal.focus();
  _focusBeforeModal = null;
  document.getElementById('bd').classList.remove('show');
  document.body.style.overflow = '';
}


/* Build modal HTML ONCE on open. updateModal() only patches values
   so that <details> stays expanded and scroll position stays put. */
function buildModal(){
  const id = openModalId; const d = BY_ID[id];
  const C  = controlsOf(d);
  const md = document.getElementById('md');

  // Per-channel groups: pair every switch with the brightness on its own gang so
  // name, toggle, slider and threshold window live together. Brights that can't
  // be paired (rare) trail as slider-only groups; pure switches stay toggle-only.
  const chanPairs = C.switches.map(s => ({s, b: brightForCode(d, s.code)}));
  const pairedBr = new Set(chanPairs.filter(p=>p.b).map(p=>p.b.code));
  const loneBrights = C.brights.filter(b => !pairedBr.has(b.code));
  const rename = s => C.switches.length>1
    ? ` <button class="renbtn" data-ren-chan="${escapeHtml(s.code)}" title="${i18n('Rename channel')}">\u270e</button>` : '';
  const chanGroup = (s, b) => {
    const name = (s && s.label) || (b && b.label) || i18n('Channel');
    const head = s ? `
        <div class="row">
          <span class="rlabel">${escapeHtml(name)}${rename(s)}</span>
          <div class="toggle" id="m_sw_${escapeHtml(s.code)}" data-code="${escapeHtml(s.code)}" data-act="toggle"></div>
        </div>` : `
        <div class="row"><span class="rlabel">${escapeHtml(name)}</span></div>`;
    const bright = b ? `
        <div class="row">
          <span class="rlabel" style="opacity:.7">${i18n('Brightness')}</span>
          <span class="rval"><b id="m_pct_${escapeHtml(b.code)}">0</b>%</span>
        </div>
        <input type="range" id="m_br_${escapeHtml(b.code)}" min="0" max="100" value="0"
               data-code="${escapeHtml(b.code)}" data-min="${escapeHtml(String(b.min))}" data-max="${escapeHtml(String(b.max))}" data-act="bright">
        <div class="dimwin">
          <span>${i18n('Limits: min')}</span>
          <input type="number" min="0" max="100" id="m_dmin_${escapeHtml(b.code)}" data-code="${escapeHtml(b.code)}" data-act="dimwin" value="${dimFloor(b)}">
          <span>${i18n('max')}</span>
          <input type="number" min="0" max="100" id="m_dmax_${escapeHtml(b.code)}" data-code="${escapeHtml(b.code)}" data-act="dimwin" value="${dimCeil(b)}">
          <span style="opacity:.6">${i18n('% (0/100 = no limits)')}</span>
        </div>` : '';
    return `<div class="chgroup">${head}${bright}</div>`;
  };
  const sectSwitches = (chanPairs.length || loneBrights.length) ? `
    <section><h3>${i18n('Controls')}</h3>${
      chanPairs.map(p => chanGroup(p.s, p.b)).join('') +
      loneBrights.map(b => chanGroup(null, b)).join('')
    }</section>` : '';
  const sectBright = '';   // brightness now lives inside each channel group above

  const sensList = [...C.sensors, ...C.sens_txt];   // triggers (action) live in bindings + the press log, not here
  const sectSensors = sensList.length ? `
    <section><h3>${i18n('Readings')}</h3>${
      sensList.map(s=>`
        <div class="row${s.advanced?' adv':''}">
          <span class="rlabel">${escapeHtml(s.label||s.code)} <span class="rval">(${escapeHtml(s.code)})</span></span>
          <span class="rval"><b id="m_sn_${escapeHtml(s.code)}">\u2014</b> ${escapeHtml(s.unit||'')}</span>
        </div>`).join('')
    }</section>` : '';

  const settings = [...C.set_bool, ...C.set_enum, ...C.set_int];
  // Order: primary first, advanced after (visible, just faded).
  settings.sort((a,b)=> (a.advanced?1:0)-(b.advanced?1:0));
  const sectSet = settings.length ? `<section><h3>${i18n('Settings')}</h3>${settings_html(d, settings)}</section>` : '';

  // Schedule/inching and binding editors moved out of the modal -- all rule
  // creation/editing now lives in the unified "Automations" tab (the modal
  // shows participation read-only below). Kept the editors out to avoid a second
  // path that could clobber rules.
  // Events log (for any device with trigger_text or for debugging)
  const sectEvents = C.trig_txt.length ? `
    <section>
      <h3>${i18n('Press log')}</h3>
      <div class="evlog" id="m_evlog">${i18n('\u2014 no events \u2014')}</div>
    </section>` : '';

  md.innerHTML = `
    <div class="head">
      <button class="closebtn" onclick="closeModal()">\u00d7</button>
      <h2 id="m_name"><span id="m_name_txt">${escapeHtml(d.name)}</span> <button class="renbtn" id="m_ren_dev"
          title="${i18n('Rename (label only)')}">\u270e</button>${
        d.transport === 'z2m' ? ` <button class="renbtn" id="m_ren_z2m"
          title="${i18n('Rename in zigbee2mqtt: changes the device name itself (and the MQTT topics), moves bindings, favourites and automations')}">\u{1f3f7}</button>` : ''}</h2>
      <div class="sub">${escapeHtml(catLabel(d.category))} \u00b7 ${escapeHtml(d.transport||'')} \u00b7 ${escapeHtml(d.model||'\u2014')} \u00b7 ${escapeHtml(d.ip||'')}
           <span id="m_online"></span></div>
    </div>
    <div class="body">
      ${sectSwitches}${sectBright}${sectSensors}${sectSet}${sectEvents}
      <section><h3>${i18n('Used in automations')}</h3>
        <div id="m_rules" style="font-size:13px;color:var(--dim)">\u2026</div></section>
      <section><details><summary>${i18n('Raw state')}</summary><pre class="raw" id="m_raw">\u2014</pre></details></section>
    </div>`;

  // wire handlers ONCE. Rename buttons are bound here, not via inline
  // onclick="fn('${id}')": a z2m friendly_name with a quote in it was an XSS.
  const rd = document.getElementById('m_ren_dev'); if(rd) rd.onclick = ()=> renameDevice(d.id);
  const rz = document.getElementById('m_ren_z2m'); if(rz) rz.onclick = ()=> renameZ2mKey(d.id);
  md.querySelectorAll('[data-ren-chan]').forEach(b=>{ b.onclick = ()=> renameChannel(d.id, b.dataset.renChan); });
  md.querySelectorAll('[data-act="toggle"],[data-act="set_bool"]').forEach(elx=>{
    elx.onclick = ()=>{
      const code = elx.dataset.code;
      const on = elx.classList.contains('on');
      elx.classList.toggle('on', !on);
      sendControl(d.id, code, !on);
    };
  });
  md.querySelectorAll('[data-act="bright"]').forEach(elx=>{
    elx.oninput = ()=>{
      const pct = document.getElementById('m_pct_'+elx.dataset.code);
      if(pct) pct.textContent = elx.value;
      pending[d.id+'/'+elx.dataset.code] = {t:Date.now(), v:+elx.value};
    };
    elx.onchange = ()=>{ sendControl(d.id, elx.dataset.code, +elx.value); };
  });
  md.querySelectorAll('[data-act="dimwin"]').forEach(inp=>{
    inp.onchange = async ()=>{
      const code = inp.dataset.code;
      const lo = document.getElementById('m_dmin_'+code);
      const hi = document.getElementById('m_dmax_'+code);
      try{
        const r = await api(`/api/devices/${encodeURIComponent(d.id)}/channel/${encodeURIComponent(code)}/dimrange`,
                            {method:'POST', headers:{'Content-Type':'application/json'},
                             body:JSON.stringify({floor:+lo.value||0, ceil:+hi.value||100})});
        const bb = controlsOf(d).brights.find(x=>x.code===code);
        if(bb){ bb.floor = r.floor; bb.ceil = r.ceil; }   // shared with the card widget
        if(lo) lo.value = r.floor;                        // reflect clamp/clear (0/100)
        if(hi) hi.value = r.ceil;
      }catch(err){ inp.style.borderColor = 'var(--bad)'; }
    };
  });
  md.querySelectorAll('[data-act="set_enum"]').forEach(btn=>{
    btn.onclick = ()=>{
      btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      sendControl(d.id, btn.dataset.code, btn.dataset.value);
    };
  });
  md.querySelectorAll('[data-act="set_int"]').forEach(inp=>{
    inp.onchange = ()=>{
      const val = parseInt(inp.value,10);
      if(!isNaN(val)) sendControl(d.id, inp.dataset.code, val);
    };
  });

  // schedule/inching + binding editors removed from the modal -- managed in the
  // "Automations" tab. Keep the press journal + participation view.
  if(C.trig_txt.length) loadEventsLog(d.id);
  loadDeviceRules(d.id);

  updateModal();   // fill initial values
}

const ROLE_LABELS = {trigger:i18n('trigger'), condition:i18n('condition'), action:i18n('action')};
async function loadDeviceRules(devId){
  const box = document.getElementById('m_rules');
  if(!box) return;
  let rules = [];
  try { rules = await api(`/api/devices/${encodeURIComponent(devId)}/rules`); }
  catch(e){ box.textContent = i18n('\u2014 failed to load \u2014'); return; }
  if(!rules.length){ box.textContent = i18n('\u2014 in none \u2014'); return; }
  box.innerHTML = '';
  for(const r of rules){
    const row = el('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 0;'+
      'border-top:1px dashed var(--line)';
    const badges = r.roles.map(role=>
      `<span class="role-badge ${escapeHtml(role)}">${escapeHtml(ROLE_LABELS[role]||role)}</span>`).join('');
    row.innerHTML = `
      <div style="flex:1;min-width:0;cursor:pointer${r.enabled?'':';opacity:.5'}">
        <span style="color:var(--txt)">${escapeHtml(ruleTitle(r))}</span>${badges}</div>
      <div class="toggle ${r.enabled?'on':''}" style="flex:none"></div>`;
    row.querySelector('div').onclick = ()=>{
      closeModal(); activeTab='auto'; localStorage.setItem('home.tab','auto');
      renderTabs(); render();
    };
    row.querySelector('.toggle').onclick = async (e)=>{
      e.stopPropagation();
      const on = !row.querySelector('.toggle').classList.contains('on');
      try{
        await api('/api/rules/enable', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id:r.id, enabled:on})});
        loadDeviceRules(devId);
      }catch(err){ alert(i18n('Error: ')+err.message); }
    };
    box.append(row);
  }
}

function switchTargetsList(){

  return DEVICES.filter(d => (d.controls||[]).some(c =>
    c.kind==='switch' || c.kind==='bright'));

const GESTURE_LABELS = {
  'click':        i18n('1\u00d7 click'),
  'double_click': i18n('2\u00d7 double'),
  'press':        i18n('\u23f5 long'),
  'single':       i18n('Pressed'),
  'true':         i18n('became "yes"'),
  'false':        i18n('became "no"'),
  'below':        i18n('below'),
  'above':        i18n('above'),
};
function gestureLabel(g){
  if(GESTURE_LABELS[g]) return GESTURE_LABELS[g];
  const m = String(g).match(/^(\d+)_single$/);
  return m ? (i18n('Button ')+m[1]) : g;
}

function sensorBindControls(d, C){
  return C.sensors.filter(s => s.code!=='battery' && s.code!=='linkquality');
}

async function loadEventsLog(id){
  const box = document.getElementById('m_evlog');
  if(!box) return;
  try{
    const r = await api(`/api/devices/${encodeURIComponent(id)}/events`);
    const items = r.items || [];
    if(!items.length){ box.innerHTML = i18n('\u2014 no events \u2014'); return; }
    box.innerHTML = items.slice().reverse().map(ev => {
      const dt = new Date(ev.ts*1000);
      const time = dt.toTimeString().slice(0,8);
      const gloss = GESTURE_LABELS[ev.value] || ev.value;
      const fired = ev.fired ? ` <span class="vchip" style="background:#1d4d3a">\u25b6 ${escapeHtml(ev.fired)}</span>` : '';
      return `<div class="ev">${time} \u2014 <b>${escapeHtml(ev.code)}</b><span class="vchip">${escapeHtml(String(gloss))}</span>${fired}</div>`;
    }).join('');
  }catch(e){
    box.innerHTML = `<span style="color:var(--bad)">${i18n('Error:')} ${escapeHtml(e.message)}</span>`;
  }
}


/* Patch only dynamic values; never touches structure */
let _modalLastEventTs = 0;

function updateModal(){
  const id = openModalId;
  if(!id || id === '__picker__' || id === '__fav_editor__' || id === '__add_device__'
        || id === '__room_picker__') return;
  const d = BY_ID[id]; if(!d) return;
  const st = STATE[id] || {online:false};
  const v = st.values || {};
  const md = document.getElementById('md');

  // Re-fetch events log if a new button event came in
  if(st.last_event_ts && st.last_event_ts !== _modalLastEventTs){
    _modalLastEventTs = st.last_event_ts;
    if(document.getElementById('m_evlog')) loadEventsLog(d.id);
  }

  const onEl = document.getElementById('m_online');
  if(onEl) onEl.innerHTML = st.online
    ? `<span style="color:var(--ok)">\u25cf ${i18n('online')}</span>`
    : `<span style="color:var(--bad)">\u25cf ${i18n('offline')}</span>`;

  for(const ctl of d.controls){
    const val = v[ctl.code];
    if(ctl.kind==='switch' || ctl.kind==='setting_bool'){
      const t = document.getElementById('m_sw_'+ctl.code) ||
                md.querySelector(`[data-code="${CSS.escape(ctl.code)}"][data-act="set_bool"]`);
      if(t) t.classList.toggle('on', !!val);
    }
    if(ctl.kind==='bright'){
      const sl = document.getElementById('m_br_'+ctl.code);
      const pc = document.getElementById('m_pct_'+ctl.code);
      const pkey = d.id+'/'+ctl.code;
      const p = pending[pkey];
      const fresh = p && Date.now()-p.t < 4000;
      if(sl && !fresh && val!=null){
        const span = ctl.max - ctl.min;
        const ui = Math.round((val-ctl.min)/span*100);
        sl.value = ui; if(pc) pc.textContent = ui;
      }
    }
    if(ctl.kind==='sensor' || ctl.kind==='sensor_text' || ctl.kind==='trigger_text'){
      const cell = document.getElementById('m_sn_'+ctl.code);
      if(cell){
        cell.textContent = val==null ? '\u2014' : (typeof val==='boolean' ? (val?i18n('yes'):i18n('no')) : val);
        cell.classList.toggle('blob', typeof val==='string' && val.length > 24);
      }
    }
    if(ctl.kind==='setting_enum'){
      const buttons = md.querySelectorAll(`[data-code="${CSS.escape(ctl.code)}"][data-act="set_enum"]`);
      buttons.forEach(b => b.classList.toggle('sel', b.dataset.value === String(val)));
    }
    if(ctl.kind==='setting_int'){
      const inp = md.querySelector(`[data-code="${CSS.escape(ctl.code)}"][data-act="set_int"]`);
      if(inp && document.activeElement !== inp && val!=null) inp.value = val;
    }
  }
  const raw = document.getElementById('m_raw');
  if(raw) raw.textContent = JSON.stringify(st.raw||{}, null, 2);
}

function settings_html(d, list){
  let h='';
  for(const s of list){
    const adv = s.advanced ? ' adv' : '';
    if(s.kind==='setting_bool'){
      h += `<div class="row${adv}">
              <span class="rlabel">${escapeHtml(s.label)}</span>
              <div class="toggle" data-code="${escapeHtml(s.code)}" data-act="set_bool"></div>
            </div>`;
    } else if(s.kind==='setting_enum'){
      h += `<div class="row${adv}"><span class="rlabel">${escapeHtml(s.label)}</span></div>
            <div class="enum${adv?' adv':''}">${
              s.range.map(opt=>`<button data-code="${escapeHtml(s.code)}" data-value="${escapeHtml(opt)}" data-act="set_enum">${
                escapeHtml((s.labels||{})[opt]||opt)
              }</button>`).join('')
            }</div>`;
    } else if(s.kind==='setting_int'){
      h += `<div class="row${adv}">
              <span class="rlabel">${escapeHtml(s.label)}</span>
              <div class="num">
                <input type="number" min="${escapeHtml(String(s.min))}" max="${escapeHtml(String(s.max))}"
                       data-code="${escapeHtml(s.code)}" data-act="set_int">
                <span class="unit">${escapeHtml(s.unit||'')}</span>
              </div>
            </div>`;
    }
  }
  return h;
}

async function renameChannel(id, code){
  const d = BY_ID[id]; if(!d) return;
  const c = (d.controls||[]).find(x=>x.code===code); if(!c) return;
  const cur = c.label || code;
  const raw = prompt(i18n('Channel name (empty = default):'), cur);
  if(raw === null) return;
  const name = raw.trim();
  if(name === cur) return;
  try{
    const r = await api(`/api/devices/${encodeURIComponent(id)}/channel/${encodeURIComponent(code)}/rename`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name}),
    });
    c.label = r.label;
    if(openModalId===id) openModal(id);
    render();
  }catch(e){ alert(i18n('Could not rename the channel: ')+e.message); }
}

// Two different things, on purpose. renameDevice() sets a display label only.
// This one changes the device's IDENTITY in zigbee2mqtt -- the friendly_name IS
// the key here and it is part of every MQTT topic -- so the server migrates all
// references in one step.
async function renameZ2mKey(id){
  const to = (prompt(i18n('New device name in zigbee2mqtt (this changes the MQTT topics too):'), id) || '').trim();
  if(!to || to === id) return;
  try{
    const r = await api('/api/zigbee/device/rename', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, to}),
    });
    const m = r.migrated || {};
    // everything the server moved, not a hand-picked few (the keys are the server's section names)
    const parts = Object.entries(m).filter(([, n]) => n).map(([k, n]) => `${i18n(k.replace(/_/g, ' ') + ':')} ${n}`);
    let msg = `${i18n('Done:')} ${id} -> ${to}` + (parts.length ? `${i18n('\nMoved --')} ${parts.join(', ')}` : '');
    alert(msg);
    closeModal();
    DEVICES = localizeDevices(await api('/api/devices'));
    BY_ID = Object.fromEntries(DEVICES.map(x => [x.id, x]));
    await loadFavorites();
    renderTabs(); render();
  }catch(e){ alert(i18n('Could not rename: ')+e.message); }
}

async function renameDevice(id){
  const d = BY_ID[id]; if(!d) return;
  const name = (prompt(i18n('New device name:'), d.name) || '').trim();
  if(!name || name === d.name) return;
  try{
    const r = await api(`/api/devices/${encodeURIComponent(id)}/rename`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name}),
    });
    d.name = r.name;
    const nt = document.getElementById('m_name_txt');
    if(nt) nt.textContent = r.name;          // only the text: both rename buttons stay
    const cn = document.querySelector('#c_'+CSS.escape(id)+' .name');
    if(cn) cn.textContent = r.name;
  }catch(e){ alert(i18n('Could not rename: ')+e.message); }
}

// One dialog per burst: with the broker down every tap fails, and a per-tap
// alert() made the app unusable exactly when you needed to read the reason.
let _lastFailNote = 0;
function notifyFail(msg){
  const now = Date.now();
  if(now - _lastFailNote < 5000) { console.warn(msg); return; }
  _lastFailNote = now;
  alert(msg);
}


async function sendControl(id, code, value){
  const prev = STATE[id]?.values ? STATE[id].values[code] : undefined;
  if(STATE[id]?.values) STATE[id].values[code] = value;
  optimistic[id+'/'+code] = {value, expires: Date.now() + OPT_HOLD_MS};
  updateCards();
  try{
    await api(`/api/devices/${encodeURIComponent(id)}/control`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code, value}),
    });
    return true;
  }catch(e){
    // The command did NOT happen. Holding the optimistic value for the full
    // OPT_HOLD_MS showed a lie (lamp "on" while the room stays dark) and hid the
    // error, so drop the hold, put the old value back and say it out loud.
    delete optimistic[id+'/'+code];
    if(STATE[id]?.values && prev !== undefined) STATE[id].values[code] = prev;
    updateCards();
    notifyFail(`${i18n('Could not run:')} ${e.message}`);
    console.warn('control fail', id, code, e.message);
    return false;
  }
}

// Rendered once per discovery -- no polling here, so nothing can steal focus
// from the name field the way the Zigbee list used to.
function renderEsphomeList(nodes){
  const list = document.getElementById('md').querySelector('#esp-list');
  if(!list) return;
  if(!nodes.length){
    list.innerHTML = '<div class="bindcaption">' + i18n('Nothing found. The node needs an mqtt: block in its yaml.') + '</div>';
    return;
  }
  list.innerHTML = nodes.map(n=>{
    // alive: 'online' | 'offline' | null. null = the node never published its LWT, so it is
    // already gone and only its retained configs are left on the broker. Those hang around
    // forever and confuse this list -- they need cleaning up, not "adding".
    const live = n.alive === 'online' ? i18n('online')
               : n.alive === 'offline' ? i18n('off') : i18n('leftover on the broker, no node');
    const sub = [n.model, `${n.n_controls} ${i18n('channels')}`, live].filter(Boolean).join(' \u00b7 ');
    if(n.alive == null && !n.registered) return `<div class="row">
      <span class="rlabel">\u26a0 ${escapeHtml(n.title)}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${escapeHtml(sub)} ${i18n('\u2014 nothing to add, the node does not answer')}</span></span>
      <button class="dlg-btn esp-purge" data-node="${escapeHtml(n.node)}">${i18n('Clean up')}</button></div>`;
    if(n.registered) return `<div class="row">
      <span class="rlabel">\u2713 ${escapeHtml(n.title)}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${escapeHtml(sub)} ${i18n('\u00b7 already added as "')}${escapeHtml(n.device_id||'')}"</span></span>
      <button class="dlg-btn esp-del" data-node="${escapeHtml(n.node)}" data-id="${escapeHtml(n.device_id||'')}">${i18n('Remove')}</button></div>`;
    if(!n.n_controls) return `<div class="row">
      <span class="rlabel">${escapeHtml(n.title)}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${i18n('no supported channels')}${(n.skipped||[]).length ? ` ${i18n('\u00b7 skipped:')} ${escapeHtml(n.skipped.slice(0,4).join(', '))}` : ''}</span></span></div>`;
    return `<div class="row" style="flex-wrap:wrap;gap:8px">
      <span class="rlabel">${escapeHtml(n.title)}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${escapeHtml(sub)}</span></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">
        <input class="esp-name" data-node="${escapeHtml(n.node)}" placeholder="${i18n('name')}"
          value="${escapeHtml(n.title)}"
          style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;width:140px">
        <select class="esp-cat" data-node="${escapeHtml(n.node)}"
          style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font:inherit">
          ${ESP_CATS.map(([v,l])=>`<option value="${v}">${escapeHtml(l)}</option>`).join('')}
        </select>
        <button class="dlg-btn primary esp-add" data-node="${escapeHtml(n.node)}">OK</button>
      </span></div>`;
  }).join('');
  list.querySelectorAll('.esp-purge').forEach(btn=>{
    btn.onclick = async ()=>{
      const node = btn.dataset.node;
      if(!confirm(`${i18n('Remove the retained configs of "')}${node}${i18n('"?\n\nThe node itself is not touched \u2014 if it ever comes back online, its configs are published again.')}`)) return;
      btn.disabled = true; btn.textContent = '\u2026';
      try{
        await api('/api/esphome/purge_discovery', {method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify({node})});
        openEsphomeAdd();        // redrawing the list is the confirmation
      }catch(e){
        btn.disabled = false; btn.textContent = i18n('Clean up');
        alert(i18n('Failed: ') + (e.message||e));
      }
    };
  });
  list.querySelectorAll('.esp-del').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id, node = btn.dataset.node;
      if(!id){ alert(i18n('This device was added by hand \u2014 remove it from mqtt_devices.json')); return; }
      if(!confirm(`${i18n('Remove "')}${id}${i18n('" from the dashboard? The device itself is not touched.')}`)) return;
      btn.disabled = true; btn.textContent = '\u2026';
      try{
        await api('/api/esphome/remove', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id}),
        });
        DEVICES = localizeDevices(await api('/api/devices'));
        BY_ID = Object.fromEntries(DEVICES.map(d => [d.id, d]));
        renderTabs(); render();
        const hit = nodes.find(x => x.node === node);
        if(hit){ hit.registered = false; hit.device_id = null; }
        renderEsphomeList(nodes);
      }catch(e){
        btn.disabled = false; btn.textContent = i18n('Remove');
        alert(i18n('Could not remove: ') + (e.message || e));
      }
    };
  });
  list.querySelectorAll('.esp-add').forEach(btn=>{
    btn.onclick = async ()=>{
      const node = btn.dataset.node;
      const nm = list.querySelector(`.esp-name[data-node="${CSS.escape(node)}"]`);
      const ct = list.querySelector(`.esp-cat[data-node="${CSS.escape(node)}"]`);
      // Onboarding a node that is not answering produces a card that is offline
      // forever -- almost always a retired node still advertising itself through
      // retained configs. Say so, and only proceed if that is really the intent.
      const hitNow = nodes.find(x => x.node === node);
      let force = false;
      if(hitNow && hitNow.alive !== 'online'){
        const why = hitNow.alive === 'offline' ? i18n('node is off')
                                               : i18n('node is gone, only its leftovers on the broker');
        if(!confirm(`"${hitNow.title}": ${why}${i18n('.\n\nThe card will be offline and its controls')} `
                    + `${i18n('will do nothing. Add it anyway?')}`)) return;
        force = true;
      }
      btn.disabled = true; btn.textContent = '\u2026';
      try{
        const res = await api('/api/esphome/add', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({node, name:(nm && nm.value || '').trim(),
                                category:(ct && ct.value) || 'switch', force}),
        });
        DEVICES = localizeDevices(await api('/api/devices'));
        BY_ID = Object.fromEntries(DEVICES.map(d => [d.id, d]));
        renderTabs(); render();
        // mark it locally instead of re-scanning MQTT (a rescan costs ~6s)
        const hit = nodes.find(x => x.node === node);
        if(hit){ hit.registered = true; hit.device_id = res.id; }
        renderEsphomeList(nodes);
      }catch(e){
        btn.disabled = false; btn.textContent = 'OK';
        alert(i18n('Could not add: ') + (e.message || e));
      }
    };
  });
}

function tabForCategory(cat){
  const t = TABS.find(t => (t.cats||[]).includes(cat));
  return t ? t.label : i18n('Other');
}

async function zbPoll(){
  if(openModalId !== '__zigbee_pair__') return;
  let s;
  try{ s = await api('/api/zigbee/pair/status'); }catch(e){ return; }
  const md = document.getElementById('md');
  const banner = md.querySelector('#zb-banner');
  if(banner) banner.textContent = s.active
    ? `${i18n('Pairing stays open for')} ${s.remaining} ${i18n('s \u2014 put the device into pairing')}`
    : i18n('The pairing window is closed. Close and reopen to extend it.');
  const list = md.querySelector('#zb-list');
  if(!list) return;
  const orphans = s.orphans || [];
  // The poll fires every 2s. Rewriting innerHTML unconditionally destroyed and
  // recreated the name <input> on every tick: the value was carried over but the
  // focus and the caret were not, so typing a name was practically impossible.
  // Re-render ONLY when the server-side data actually changed, and even then put
  // focus and selection back where the user had them.
  const sig = JSON.stringify([
    s.found.map(f => [f.ieee, f.interview, f.registered, f.name, f.category, f.unsupported]),
    orphans.map(o => [o.id, o.ieee]),
  ]);
  if(list.dataset.sig === sig) return;
  const ae = document.activeElement;
  const focusIeee = (ae && ae.classList && ae.classList.contains('zb-name'))
    ? ae.dataset.ieee : null;
  const selStart = focusIeee ? ae.selectionStart : null;
  const selEnd   = focusIeee ? ae.selectionEnd   : null;
  if(!s.found.length && !orphans.length){
    list.innerHTML = '<div class="bindcaption">' + i18n('Nothing yet. Waiting for devices\u2026') + '</div>';
    list.dataset.sig = sig;
    return;
  }
  // preserve any name the user is typing across a re-render
  const typed = {};
  list.querySelectorAll('.zb-name').forEach(i => typed[i.dataset.ieee] = i.value);
  list.innerHTML = s.found.map(f=>{
    const title = escapeHtml(f.description || f.model || f.friendly_name);
    const sub = escapeHtml([f.vendor, f.model].filter(Boolean).join(' \u00b7 ') || f.ieee);
    if(f.registered){
      const raw = String(f.name||'').startsWith('0x');
      const cur = typed[f.ieee] !== undefined ? typed[f.ieee] : (raw ? '' : f.name);
      const shown = raw ? (f.description || f.model || f.name) : f.name;
      return `<div class="row" style="flex-wrap:wrap;gap:8px">
        <span class="rlabel">\u2713 ${escapeHtml(shown)}
          <span style="color:var(--dim);font-weight:400">\u2192 ${escapeHtml(tabForCategory(f.category))} ${i18n('\u00b7 added')}</span>
          ${f.unsupported ? `<br><span style="color:var(--warn,#e0a030);font-weight:400;font-size:12px">${i18n('z2m did not recognise the device \u2014 nothing to control. Remove it and pair again closer to the coordinator.')}</span>` : ''}</span>
        <span style="display:flex;gap:6px">
          <input class="zb-name" data-ieee="${escapeHtml(f.ieee)}" data-fn="${escapeHtml(f.friendly_name)}"
            placeholder="${i18n('device name')}" value="${escapeHtml(cur)}"
            style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;width:150px">
          <button class="dlg-btn zb-add" data-ieee="${escapeHtml(f.ieee)}">${i18n('Rename')}</button>
        </span></div>`;
    }
    if(f.interview !== 'done'){
      const txt = f.interview === 'failed' ? i18n('interview failed') : i18n('identifying\u2026');
      return `<div class="row"><span class="rlabel">${title}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${sub}</span></span>
        <span style="color:var(--dim)">${txt}</span></div>`;
    }
    const dflt = typed[f.ieee] !== undefined ? typed[f.ieee] : (f.model || '');
    return `<div class="row" style="flex-wrap:wrap;gap:8px">
      <span class="rlabel">${title}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${sub}</span></span>
      <span style="display:flex;gap:6px">
        <input class="zb-name" data-ieee="${escapeHtml(f.ieee)}" data-fn="${escapeHtml(f.friendly_name)}"
          placeholder="${i18n('device name')}" value="${escapeHtml(dflt)}"
          style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;width:150px">
        <button class="dlg-btn primary zb-add" data-ieee="${escapeHtml(f.ieee)}">OK</button>
      </span></div>`;
  }).join('') + (orphans.length ? `
    <div class="bindcaption" style="margin-top:12px">${i18n('Unidentified on the network (from earlier attempts)')}</div>
    ${orphans.map(o => `<div class="row">
      <span class="rlabel">${escapeHtml(o.name)}<br><span style="color:var(--dim);font-weight:400;font-size:12px">${escapeHtml(o.ieee || '')} ${i18n('\u00b7 z2m could not identify the model')}</span></span>
      <button class="dlg-btn zb-del" data-id="${escapeHtml(o.id)}">${i18n('Delete')}</button>
    </div>`).join('')}` : '');
  list.dataset.sig = sig;
  if(focusIeee){
    const back = list.querySelector(`.zb-name[data-ieee="${CSS.escape(focusIeee)}"]`);
    if(back){ back.focus(); try{ back.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
  list.querySelectorAll('.zb-del').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      if(!confirm(`${i18n('Delete "')}${id}${i18n('" from the Zigbee network?')}`)) return;
      btn.disabled = true; btn.textContent = '\u2026';
      try{
        let r = await api('/api/zigbee/device/remove', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id}),
        });
        // a device that never answered needs the forced database-level drop
        if(!r.removed) r = await api('/api/zigbee/device/remove', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id, force:true}),
        });
        if(!r.removed) throw new Error(i18n('z2m did not release the device'));
        DEVICES = localizeDevices(await api('/api/devices'));
        BY_ID = Object.fromEntries(DEVICES.map(d => [d.id, d]));
        renderTabs(); render();
        list.dataset.sig = '';        // force the next poll to redraw
        zbPoll();
      }catch(e){
        btn.disabled = false; btn.textContent = i18n('Delete');
        alert(i18n('Could not delete: ') + (e.message || e));
      }
    };
  });
  list.querySelectorAll('.zb-add').forEach(btn=>{
    btn.onclick = async ()=>{
      const ieee = btn.dataset.ieee;
      const inp = list.querySelector(`.zb-name[data-ieee="${CSS.escape(ieee)}"]`);
      const name = (inp && inp.value || '').trim();
      const fn = inp ? inp.dataset.fn : '';
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '\u2026';
      try{
        await api('/api/zigbee/pair/add', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ieee, friendly_name: fn, name}),
        });
        DEVICES = localizeDevices(await api('/api/devices'));         // refresh list+tabs, keep WS + modal
        BY_ID = Object.fromEntries(DEVICES.map(d => [d.id, d]));
        renderTabs(); render();
        list.dataset.sig = '';        // force the next poll to redraw
        zbPoll();
      }catch(e){
        btn.disabled = false; btn.textContent = orig;
        alert(i18n('Failed: ') + (e.message || e));
      }
    };
  });
}


// PWA: register service worker + custom "Install" button (Chrome auto-prompt

})();

init().catch(e=>{
  $('#app').innerHTML = `<div class="skeleton">${i18n('Error:')} ${escapeHtml(e.message)}</div>`;
});

// --- auto-refresh structural data on resume -------------------------------
// Devices / favorites load once in init(); live values come
// over WebSocket. When the PWA is backgrounded and config changes server-side
// (new favorite, freshly paired device), the running tab never re-fetches the
// list. Re-pull it whenever the app regains visibility or focus, throttled so a
// visibility+focus burst doesn't double-fetch, and skip re-render mid-modal.
let _lastSoftReload = 0;
async function softReload(){
  const now = Date.now();
  if (now - _lastSoftReload < 3000) return;
  _lastSoftReload = now;
  try {
    DEVICES = localizeDevices(await api('/api/devices'));
    BY_ID = Object.fromEntries(DEVICES.map(d => [d.id, d]));
    await loadFavorites();
    try { RULES = await api('/api/rules'); } catch(e){ }
    if (!openModalId) { renderTabs(); render(); }
  } catch(e){ /* offline / transient -- WS reconnect recovers live state */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') softReload();
});
window.addEventListener('focus', softReload);


</script>
</body>
