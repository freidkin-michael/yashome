<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YasH!</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e1116">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-maskable-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0e1116; --card:#1a1f29; --card2:#232a36; --line:#2c3442;
    --txt:#e6eaf0; --dim:#8a93a3; --accent:#3CC2B8; --accent-fill:#177A75; --on:#FFC34D; --ok:#3ad29f;
    --bad:#e35d6a; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  /* iPhone PWA (black-translucent, viewport-fit=cover): the page runs under the clock and the
     island. A fixed strip keeps scrolled content out of that zone; everything fixed or sticky
     below keeps clear of the insets itself. */
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);
    background:var(--bg);z-index:45}
  header{padding:22px 18px 6px;display:flex;align-items:baseline;justify-content:space-between;
         flex-wrap:wrap;row-gap:8px}
  header h1{font-size:28px;margin:0;font-weight:650;letter-spacing:-.3px}
  #conn{font-size:13px;color:var(--dim)} #conn.live{color:var(--ok)}
  .conngroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;row-gap:6px}
  /* phone: page must never scroll sideways; tighter header/tabs */
  /* clip keeps the tab bar sticky (hidden makes body a scroll container); Safari < 16 does not know
     clip, keeps the hidden line above and at least never scrolls sideways */
  html,body{max-width:100vw;overflow-x:hidden;overflow-x:clip}
  @media (max-width:480px){
    header{padding:14px 12px 4px}
    header h1{font-size:22px}
    .tabs{padding:8px 8px 2px}
    .tab{font-size:13.5px;padding:7px 10px}
    #conn{display:none}
  }
  .room{padding:20px 18px 6px;font-size:13px;text-transform:uppercase;
        letter-spacing:.8px;color:var(--dim);font-weight:600}

  /* tabs: CRM-style drawer behind a burger */
  #tabbar{display:flex;align-items:center;gap:12px;padding:10px 14px;
          border-bottom:1px solid var(--line);background:var(--bg);
          position:sticky;top:env(safe-area-inset-top);z-index:5}
  #tabburger{background:var(--card2);border:1px solid var(--line);color:var(--txt);
             font-size:18px;width:40px;height:40px;border-radius:10px;cursor:pointer}
  #tabtitle{font-size:17px;font-weight:700}
  #tabtitle .badge{display:inline-block;background:var(--card2);color:var(--dim);
                   border-radius:9px;padding:1px 8px;font-size:12px;margin-left:8px}
  #taboverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;
              opacity:0;pointer-events:none;transition:opacity .2s}
  #taboverlay.show{opacity:1;pointer-events:auto}
  .tabs{position:fixed;left:0;top:0;bottom:0;width:calc(240px + env(safe-area-inset-left));z-index:40;
        display:flex;flex-direction:column;gap:4px;
        padding:calc(16px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom))
                calc(10px + env(safe-area-inset-left));
        background:var(--card);border-right:1px solid var(--line);
        overflow-y:auto;transform:translateX(-100%);transition:transform .2s}
  .tabs.open{transform:none}
  .tab{background:transparent;border:0;color:var(--dim);font:inherit;
       font-size:15px;font-weight:600;padding:11px 12px;cursor:pointer;
       border-radius:10px;border-left:3px solid transparent;text-align:left;
       display:flex;justify-content:space-between;align-items:center;gap:8px;
       transition:.15s}
  .tab:hover{color:var(--txt);background:var(--card2)}
  .tab.active{color:var(--on);border-left-color:var(--on);background:var(--card2)}
  .tab .badge{display:inline-block;background:var(--card2);color:var(--dim);
              border-radius:8px;padding:1px 7px;font-size:11px;font-weight:500;
              margin-left:5px}
  .tab.active .badge{background:#3a2e10;color:var(--on)}
  /* Rooms: horizontal chips in the header, right of the Yashome logo */
  .brandgroup{display:flex;align-items:center;gap:14px;flex-wrap:wrap;row-gap:8px}
  #roomsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;row-gap:6px}
  .roomchip{background:var(--card);border:1px solid var(--line);color:var(--dim);
            font:inherit;font-size:14px;font-weight:600;padding:7px 14px;
            border-radius:999px;cursor:pointer;transition:.15s;
            display:flex;align-items:center;gap:6px}
  .roomchip:hover{color:var(--txt);background:var(--card2)}
  .roomchip.active{color:var(--on);border-color:var(--on);background:var(--card2)}
  .roomchip .badge{display:inline-block;background:var(--card2);color:var(--dim);
                   border-radius:8px;padding:1px 7px;font-size:11px;font-weight:500}
  .roomchip.active .badge{background:#3a2e10;color:var(--on)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
        gap:14px;padding:10px 14px 24px}
  /* Compact tabs (switches, rooms and other "buttons only" tabs): a tile without
     dead space -- no min-height and no "category . transport" line, everything smaller.
     Dense packing (masonry): 8px tracks, every card spans as many as its real
     height needs (packGrid) -- several small tiles stack under a tall AC card in the
     same column instead of a gap */
  .grid.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
                grid-auto-rows:8px}
  .grid.compact .card{min-height:0;padding:10px 12px;gap:6px}
  .grid.compact .card > .name{font-size:14px}
  .grid.compact .info .meta{display:none}
  .grid.compact .dot{width:34px;height:34px;font-size:12px}
  .grid.compact .dotlabel{font-size:11px}
  /* "Order" mode on device grids -- the same lift animation as favourites */
  .grid .card.editing{cursor:grab;border-style:dashed;touch-action:none;user-select:none}
  .grid .card.dragging{opacity:.85;z-index:5;cursor:grabbing}
  .grid .card.drop-target{border-color:var(--accent);background:#1f2a3d}
  /* corner handle for resizing a tile */
  .card .resizer{position:absolute;right:0;bottom:0;width:26px;height:26px;z-index:6;
    cursor:nwse-resize;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:12px;background:var(--card2);
    border:1px solid var(--line);border-radius:8px 0 8px 0;touch-action:none}
  .card .resizer:hover{color:var(--on);border-color:var(--on)}
  /* ghost of the future size while resizing: the grid is left alone until release */
  .rzghost{position:fixed;z-index:50;border:2px dashed var(--on);pointer-events:none;
    border-radius:var(--radius);background:rgba(240,180,41,.07);color:var(--on);
    display:flex;align-items:flex-end;justify-content:flex-end;
    padding:6px 10px;font-size:12px;font-weight:600}

  /* card layout */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:grid;grid-template-rows:auto 1fr auto;
    grid-template-columns:minmax(0,1fr);gap:10px;
    min-height:180px;position:relative;cursor:pointer;overflow:hidden;
    transition:border-color .15s, background .25s;
  }
  .card.any-on{background:linear-gradient(160deg,#322712,var(--card));border-color:#5a4a1e}
  .card.offline{opacity:.45}
  .card.offline .name::after{content:var(--offline-txt, " \2022  offline");color:var(--bad);font-weight:400;font-size:12px}

  .name{font-weight:600;font-size:17px;line-height:1.2;
        overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
        -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .info{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px;
        overflow:hidden;justify-content:flex-end}
  .info .sens{display:flex;gap:10px;flex-wrap:wrap}
  .info .sens b{color:var(--txt);font-weight:500}
  .meta{font-size:11px;color:var(--dim);text-transform:lowercase;opacity:.7}

  /* switch dots row at bottom */
  .switches{display:flex;gap:10px;justify-content:flex-end;align-items:flex-start;
            flex-wrap:wrap;padding-top:6px}
  .switches.center{justify-content:center}
  .dotwrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:46px;
           cursor:pointer}
  .dot{
    width:42px;height:42px;border-radius:50%;background:var(--card2);
    border:1.5px solid var(--line);transition:.15s;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--dim);font-weight:600;
  }
  .dot.on{background:var(--on);border-color:var(--on);
          box-shadow:0 0 14px var(--on),0 0 3px var(--on);color:#1a1500}
  .dotwrap:active .dot{transform:scale(.9)}
  .dotlabel{font-size:11px;color:var(--dim);max-width:62px;text-align:center;
            line-height:1.1;overflow:hidden;text-overflow:ellipsis;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* inline dimmer on the card (dd strips, dimmable lamps) */
  .brightrow{display:flex;align-items:center;gap:6px;padding:8px 0 0;
             max-width:100%;box-sizing:border-box}
  .brightrow .brlbl{flex:0 0 auto;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .enumrow{max-width:100%;box-sizing:border-box}
  .enumrow select{min-width:0;max-width:55%}
  .brightrow input[type=range]{flex:1;min-width:0;accent-color:var(--on);height:22px;margin:0}
  .brpc{font-size:11px;color:var(--dim);min-width:32px;flex:0 0 auto;text-align:right}
  .fav-card .brightrow{width:100%;padding:4px 0 0;gap:6px}
  .fav-card .brightrow .brpc{font-size:11px;min-width:30px}

  /* modal: one dimmer channel as a self-contained group (name + toggle + slider
     + its own threshold window), so a slider is never detached from its gang */
  .chgroup{padding:12px 0;border-top:1px solid var(--line)}
  .chgroup:first-child{border-top:0}
  .dimwin{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .dimwin input{width:58px;background:#1b2330;color:#dfe7f3;border:1px solid #2a3547;
                border-radius:6px;padding:4px 6px;font-size:12px}

  /* favorites */
  .fav-toolbar{display:flex;justify-content:space-between;align-items:center;
               padding:14px 18px 4px;gap:10px;flex-wrap:wrap}
  .fav-toolbar button{background:var(--card2);border:1px solid var(--line);
                      color:var(--txt);border-radius:10px;padding:8px 14px;
                      cursor:pointer;font:inherit;font-size:14px;font-weight:500}
  .fav-toolbar button.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
  .fav-toolbar button.active{background:var(--on);border-color:var(--on);color:#1a1500}
  /* 4 per row on every screen; circle and font sizes follow the width */
  .fav-grid{display:grid;grid-template-columns:repeat(4,1fr);
            gap:8px;padding:8px 10px 24px}
  @media (min-width:520px){.fav-grid{gap:12px;padding:10px 14px 24px}}
  .fav-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
            padding:8px 6px;display:flex;flex-direction:column;align-items:center;
            justify-content:space-between;gap:6px;min-height:0;text-align:center;
            position:relative;transition:.15s;cursor:pointer;
            -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  /* dimmable round control: yellow fills the CIRCLE bottom-up = brightness */
  .dimdot{position:relative;overflow:hidden}
  .dimdot .dotfill{position:absolute;left:0;right:0;bottom:0;height:0;
            background:linear-gradient(0deg,#ffcf2e,#ffcf2e7a);
            pointer-events:none;opacity:0;transition:height .1s linear,opacity .15s}
  .dimdot.on .dotfill{opacity:1}
  /* horizontal variant: the 3-zone dimmer pill on a multi-channel card fills
     left-to-right, so the level reads at a glance */
  .dimpill{position:relative;overflow:hidden}
  .dimpill .dotfill{position:absolute;left:0;top:0;bottom:0;right:auto;
            height:auto;width:0;
            background:linear-gradient(90deg,#ffcf2e,#ffcf2e7a);
            pointer-events:none;opacity:0;transition:width .1s linear,opacity .15s}
  .dimpill.on .dotfill{opacity:1}
  .dimpill > span{position:relative;z-index:1}
  .fav-card .bigdot.dimdot.on, .dot.dimdot.on{
            background:var(--card2);border-color:var(--on);color:var(--txt);
            box-shadow:0 0 16px var(--on),0 0 4px var(--on)}
  .dimpc{font-size:11px;font-weight:700;color:var(--txt);min-height:13px;line-height:1.2}
  .fav-card:not(.on) .dimpc{visibility:hidden}
  @media (min-width:520px){.fav-card{padding:10px 10px;gap:8px;border-radius:18px}}
  .fav-card.on{background:linear-gradient(160deg,#322712,var(--card));border-color:#5a4a1e}
  .fav-card.offline{opacity:.4}
  /* delete-select mode */
  .fav-toolbar button.danger{background:#b3261e;border-color:#b3261e;color:#fff}
  .fav-toolbar button:disabled{opacity:.45;cursor:default}
  .fav-card.selectable{cursor:pointer}
  .fav-card.selected{outline:2px solid #e5484d;border-color:#e5484d;
                     background:linear-gradient(160deg,#3a1512,var(--card))}
  .fav-card .selmark{position:absolute;top:6px;right:8px;width:20px;height:20px;
                     border-radius:50%;border:2px solid var(--line);background:var(--card2);
                     display:flex;align-items:center;justify-content:center;
                     font-size:13px;font-weight:700;color:#fff;line-height:1}
  .fav-card.selected .selmark{background:#e5484d;border-color:#e5484d}
  .fav-card .orphan{font-size:10px;color:var(--dim);line-height:1.15}
  .fav-card .alias{font-size:11.5px;font-weight:600;line-height:1.15;
                   word-break:break-word;hyphens:auto;width:100%}
  @media (min-width:420px){.fav-card .alias{font-size:13px}}
  @media (min-width:600px){.fav-card .alias{font-size:14px}}
  @media (min-width:780px){.fav-card .alias{font-size:15px}}
  .fav-card .bigdot{
    width:54px;height:54px;border-radius:50%;background:var(--card2);
    border:2px solid var(--line);cursor:pointer;transition:.15s;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  @media (min-width:420px){.fav-card .bigdot{width:62px;height:62px}}
  @media (min-width:600px){.fav-card .bigdot{width:72px;height:72px}}
  @media (min-width:780px){.fav-card .bigdot{width:80px;height:80px;border-width:2.5px}}
  .fav-card .bigdot.on{background:var(--on);border-color:var(--on);
                       box-shadow:0 0 22px var(--on),0 0 5px var(--on)}
  .fav-card .bigdot:active{transform:scale(.9)}
  .fav-card.editing{border-style:dashed;cursor:grab;touch-action:none;transition:.18s ease}
  .fav-card.editing:active{cursor:grabbing}
  .fav-card.dragging{opacity:.92;z-index:10;
                     box-shadow:0 10px 28px rgba(0,0,0,.5);
                     border-color:var(--accent);border-style:solid;transition:none}
  .fav-card.drop-target{border-color:var(--accent);background:#1f2a3d}
  .fav-card .alias[contenteditable=true]{outline:1px dashed var(--accent);
                                          border-radius:4px;padding:2px 4px}
  .fav-empty{padding:30px;text-align:center;color:var(--dim);font-size:14px}

  /* picker modal -- devices with channel buttons */
  .picker-list{max-height:65vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .picker-dev{padding:12px 4px;border-top:1px solid var(--line)}
  .picker-dev:first-child{border-top:0}
  .picker-name{font-size:15px;font-weight:500;margin-bottom:8px}
  .picker-meta{font-size:11px;color:var(--dim);font-weight:400;margin-left:6px}
  .picker-channels{display:flex;gap:8px;flex-wrap:wrap}
  .picker-chan{background:var(--card2);border:1px solid var(--line);color:var(--txt);
               border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;
               font-size:14px;font-weight:500;min-width:80px;text-align:center}
  .picker-chan:hover{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
  .picker-chan.exists{opacity:.4;cursor:default;background:var(--card2)}
  .picker-chan.exists:hover{background:var(--card2);border-color:var(--line);color:var(--txt)}
  .picker-chan.active{background:var(--on);border-color:var(--on);color:#1a1500}
  .picker-chan.active:hover{background:var(--on);border-color:var(--on);color:#1a1500}

  /* event blink on card */
  .card .eventdot{position:absolute;top:10px;right:12px;width:10px;height:10px;
                  border-radius:50%;background:var(--accent);
                  box-shadow:0 0 8px var(--accent);
                  opacity:0;transition:opacity .3s}
  .card.eventflash .eventdot{opacity:1}

  .bindcaption{font-size:11px;color:var(--dim);margin-bottom:6px;font-style:italic}

  /* unified automation rules */
  .auto-wrap{max-width:860px;margin:8px auto;padding:0 4px}
  .auto-toolbar{display:flex;justify-content:space-between;align-items:center;
                gap:10px;margin:6px 0 14px}
  .auto-empty{color:var(--dim);text-align:center;padding:48px 16px;line-height:1.7}
  .rule-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
             padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
  .rule-card.off{opacity:.5}
  .rule-main{flex:1;min-width:0;cursor:pointer}
  .rule-title{font-weight:650;font-size:15px;margin-bottom:6px}
  .rule-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
  .rule-chip{background:var(--card2);border:1px solid var(--line);border-radius:8px;
             padding:3px 8px;white-space:nowrap}
  .rule-chip.when{border-color:#3a4a6a}
  .rule-chip.cond{border-color:#5a4a1e}
  .rule-chip.then{border-color:#1e5a3e}
  .rule-arrow{color:var(--dim)}
  .rule-kind{font-size:10px;text-transform:uppercase;letter-spacing:.5px;
             color:var(--dim);margin-left:6px}
  .rule-actions{display:flex;flex-direction:column;gap:8px;align-items:center}
  .rule-actions-top{display:flex;align-items:center;gap:8px}
  .rule-run{background:transparent;border:1px solid #1e5a3e;color:var(--ok);
            width:34px;height:34px;border-radius:50%;font-size:14px;line-height:1;
            cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .rule-run:hover{background:#12331f;border-color:var(--ok)}
  .rule-run:disabled{opacity:.6;cursor:default}
  .rule-del{background:transparent;border:1px solid var(--line);color:var(--dim);
            width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
  .rule-del:hover{color:var(--bad);border-color:var(--bad)}
  .role-badge{display:inline-block;font-size:10px;border-radius:6px;padding:1px 6px;
              margin-left:4px;border:1px solid var(--line);color:var(--dim)}
  .role-badge.trigger{border-color:#3a4a6a;color:#7fa0d8}
  .role-badge.condition{border-color:#5a4a1e;color:var(--on)}
  .role-badge.action{border-color:#1e5a3e;color:var(--ok)}
  /* rule builder */
  .rb-step{margin:14px 0;padding:12px;background:var(--card2);
           border:1px solid var(--line);border-radius:12px}
  .rb-step > h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;
                letter-spacing:.6px;color:var(--on)}
  .rb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .rb-row label{font-size:13px;color:var(--dim);min-width:64px}
  .rb-step select,.rb-step input{background:var(--card);border:1px solid var(--line);
       color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
  .rb-days{display:flex;gap:4px;flex-wrap:wrap}
  .rb-day{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
          background:var(--card);color:var(--dim);cursor:pointer;font:inherit;font-size:13px}
  .rb-day.on{background:var(--accent-fill);color:#fff;border-color:var(--accent-fill)}
  .rb-cond-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .rb-cond-row .rb-del{background:transparent;border:1px solid var(--line);color:var(--dim);
                       width:28px;height:28px;border-radius:50%;cursor:pointer}

  /* events log */
  .evlog{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);
         max-height:180px;overflow-y:auto;background:var(--card2);
         border-radius:8px;padding:8px}
  .evlog .ev{padding:2px 0}
  .evlog .ev b{color:var(--txt);font-weight:500}
  .evlog .ev .vchip{display:inline-block;padding:1px 6px;border-radius:8px;
                    background:#2a3a55;color:var(--txt);font-size:11px;margin-left:4px}

  /* modal */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
    display:none;align-items:stretch;justify-content:center;z-index:50;
    animation:fade .15s ease;
    /* the modal's close button must never sit under the clock or the island */
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .backdrop.show{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--card);width:100%;max-width:640px;display:flex;
    flex-direction:column;animation:up .2s ease;
  }
  .modal .head{padding:20px 22px 14px;flex:none;position:relative;
               border-bottom:1px solid var(--line)}
  .modal .body{padding:6px 22px 32px;overflow-y:auto;
               -webkit-overflow-scrolling:touch;flex:1 1 auto;overscroll-behavior:contain}
  @media (min-width:640px){
    .backdrop{align-items:center;
      padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
              max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left))}
    .modal{border-radius:22px;max-height:90vh}
  }
  @keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 6px;font-size:24px;font-weight:650;padding-right:48px;letter-spacing:-.3px}
  .modal .sub{color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .modal section{padding:18px 0;border-top:1px solid var(--line)}
  .modal section:first-of-type{padding-top:14px}
  .modal h3{font-size:12px;color:var(--dim);text-transform:uppercase;
            letter-spacing:.7px;margin:0 0 12px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;
       padding:13px 0;border-top:1px dashed var(--line);min-height:48px}
  .row:first-child{border-top:0}
  .row.adv{opacity:.65}
  .row.adv .rlabel{font-size:13px}
  .rlabel{font-size:16px;flex:1;min-width:0}
  .renbtn{background:transparent;border:0;color:var(--dim);font-size:16px;
          cursor:pointer;padding:0 4px;vertical-align:middle}
  .renbtn:hover{color:var(--txt)}
  .rval{font-size:15px;color:var(--dim);min-width:0;overflow-wrap:anywhere;text-align:right}
  .rval b{color:var(--txt);font-weight:600}
  /* raw hex blobs (scene_data etc) must never widen the modal */
  .rval b.blob{font-size:11px;font-family:ui-monospace,monospace;font-weight:400;
               display:inline-block;max-width:100%;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  /* big toggle */
  .toggle{width:58px;height:34px;border-radius:22px;background:var(--card2);
          border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
  .toggle.on{background:var(--on);border-color:var(--on)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;
                 border-radius:50%;background:#fff;transition:.2s}
  .toggle.on::after{transform:translateX(24px)}
  /* enum */
  .enum{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .enum button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
               border-radius:12px;padding:10px 16px;cursor:pointer;font-size:15px;
               min-height:44px;font:inherit;font-weight:500}
  .enum button.sel{background:var(--accent-fill);border-color:var(--accent-fill)}
  /* int input */
  .num{display:flex;align-items:center;gap:8px}
  .num input{background:var(--card2);border:1px solid var(--line);color:var(--txt);
             border-radius:10px;padding:10px 12px;width:110px;font:inherit;
             text-align:right;font-size:16px}
  .num .unit{font-size:13px;color:var(--dim);min-width:40px}
  /* slider */
  input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:8px;
    background:var(--card2);outline:none;margin:8px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
    border-radius:50%;background:var(--on);cursor:pointer;border:3px solid var(--bg)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
    background:var(--on);cursor:pointer;border:3px solid var(--bg)}

  .raw{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);
       background:var(--card2);border-radius:10px;padding:12px;white-space:pre-wrap;
       max-height:200px;overflow-y:auto}
  details summary{cursor:pointer;color:var(--dim);font-size:14px;padding:10px 0;
                  list-style:none;display:flex;align-items:center;gap:6px}
  details summary::before{content:"\25b8 ";display:inline-block;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details summary::-webkit-details-marker{display:none}

  .closebtn{position:absolute;top:14px;right:14px;width:40px;height:40px;
            border-radius:50%;background:var(--card2);border:1px solid var(--line);
            color:var(--txt);font-size:22px;cursor:pointer;line-height:1;
            display:flex;align-items:center;justify-content:center}

  /* Dialog action buttons -- all the same size */
  .dlg-btn{font:inherit;font-size:13px;line-height:1.1;padding:7px 12px;border-radius:8px;
           cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--txt);
           white-space:nowrap}
  .dlg-btn.danger{border-color:var(--bad);color:var(--bad)}
  .dlg-btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;font-weight:600}
  .addbtn{display:block;width:100%;background:var(--accent-fill);border:0;
          color:#fff;border-radius:10px;padding:12px;font:inherit;font-size:15px;
          font-weight:600;cursor:pointer;margin-top:10px}
  .addbtn:active{filter:brightness(.9)}

  .skeleton{color:var(--dim);text-align:center;padding:40px 0}

  /* header brand badge */
  #brandtitle{padding:5px 14px;border-radius:14px;transition:background-color .35s ease,color .35s ease;display:flex;align-items:center}
  #brandtitle .wordmark{height:40px;width:auto;display:block}
  @media (max-width:640px){#brandtitle .wordmark{height:32px}}
  /* settings gear: the same height as the Home badge, left of it */
  #gearbtn{font:inherit;font-size:28px;line-height:1.15;height:calc(28px * 1.15 + 4px);width:calc(28px * 1.15 + 4px);padding:0;border-radius:14px;
           background:var(--card);border:1px solid var(--line);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #gearbtn svg{width:58%;height:58%;display:block}
  @media (max-width:640px){#gearbtn{font-size:22px;height:calc(22px * 1.15 + 4px);width:calc(22px * 1.15 + 4px)}}
  .rc .rrow .dotwrap.inrow{flex-direction:row;gap:8px;min-width:0;margin-right:8px}
  .rc .rrow .dotwrap.inrow .dotlabel{display:none}   /* in the power row the dot's colour tells the state */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
let DEVICES = [];
let BY_ID   = {};
let STATE   = {};
let pending = {};   // local-applied values vs WS
let optimistic = {}; // id+'/'+code -> {value, expires} -- preserved against WS revert
let openModalId = null;
const OPT_HOLD_MS = 4000;

// One bearer token gates the API. Entered once per device, kept in
// localStorage, sent on every request; a 401 clears it and asks again.
const TOKEN_KEY = 'hs_token';
// ?token=... once (kiosks, screenshots, first visit from a link) and ?tab=... as a deep link;
// both leave the address bar so they are not bookmarked or shared by accident
const _qs = new URLSearchParams(location.search);
if(_qs.get('token')){ localStorage.setItem(TOKEN_KEY, _qs.get('token').trim()); }
if(_qs.get('tab')){ localStorage.setItem('home.tab', _qs.get('tab')); }
if(_qs.has('token') || _qs.has('tab') || _qs.has('lang')){ _qs.delete('token'); _qs.delete('tab'); _qs.delete('lang'); history.replaceState(null, '', location.pathname + (_qs.toString() ? '?' + _qs : '')); }
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
function authHeaders(h){ return Object.assign({}, h || {}, TOKEN ? {'Authorization': 'Bearer ' + TOKEN} : {}); }
function withToken(url){ return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN); }
function askToken(msg){
  const t = prompt(msg || i18n('Home access token (entered once on this device)'));
  if(t === null) return;
  TOKEN = t.trim(); localStorage.setItem(TOKEN_KEY, TOKEN); location.reload();
}
function logout(){ localStorage.removeItem(TOKEN_KEY); TOKEN = ''; location.reload(); }
// no eager prompt: behind a proxy that injects the header nobody is asked,
// so we only ask when the API actually answers 401 (see api() below).
let _focusBeforeModal = null;   // where the focus was before a modal took it
let _tokenAsked = false;   // one prompt per page: parallel 401s must not ask (or wipe) again
async function api(path, opts){
  opts = Object.assign({}, opts || {}); opts.headers = authHeaders(opts.headers);
  const sent = TOKEN;
  const r = await fetch(path, opts);
  if(r.status === 401){
    // only forget the token this request carried, never one typed in meanwhile
    if(localStorage.getItem(TOKEN_KEY) === sent) localStorage.removeItem(TOKEN_KEY);
    if(!_tokenAsked){ _tokenAsked = true; askToken(i18n('Token rejected \u2014 enter it again')); }
    throw new Error('401');
  }
  if(!r.ok) throw new Error(apiErrorText(await r.text(), r.status));
  return r.json();
}
// {"detail": "..."} or pydantic's {"detail": [{msg, loc}, ...]} -> one readable line
function apiErrorText(body, status){
  let d;
  try { d = JSON.parse(body).detail; } catch(e) { return body || `HTTP ${status}`; }
  if(typeof d === 'string') return i18n(d);
  if(Array.isArray(d)) return d.map(x => `${(x.loc || []).slice(1).join('.')}: ${i18n(x.msg || '')}`).join('; ');
  return body || `HTTP ${status}`;
}

async function init(){
  translateDom(document);   // static shell; dynamic markup goes through i18n()
  // CSS cannot call i18n(): the "offline" caption of a card comes in as a variable
  document.documentElement.style.setProperty('--offline-txt', JSON.stringify(' \u2022  ' + i18n('offline')));
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && openModalId) closeModal();
    // Tab stays inside an open modal: focus wraps from the last control to the first and back
    if(e.key === 'Tab' && openModalId){
      const md = document.getElementById('md');
      const f = [...md.querySelectorAll('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')]
        .filter(x => !x.disabled && x.offsetParent !== null);
      if(f.length){
        const first = f[0], last = f[f.length - 1];
        if(e.shiftKey && (document.activeElement === first || document.activeElement === md)){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    }
    // on/off toggles are divs: Enter / Space act like a click once they have focus
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('toggle')){
      e.preventDefault(); e.target.click();
    }
  });
  // every toggle, whenever it is rendered, is a focusable switch; a modal takes the focus
  new MutationObserver(muts => {
    for(const t of document.querySelectorAll('.toggle:not([tabindex])')){
      t.tabIndex = 0; t.setAttribute('role', 'switch');
    }
    // aria-checked follows the "on" class whenever a toggle is drawn or flips
    for(const m of muts){
      const els = m.type === 'attributes' ? [m.target] : [...m.addedNodes].filter(n => n.querySelectorAll)
        .flatMap(n => [n, ...n.querySelectorAll('.toggle')]);
      for(const t of els) if(t.classList && t.classList.contains('toggle')){
        const v = t.classList.contains('on') ? 'true' : 'false';
        if(t.getAttribute('aria-checked') !== v) t.setAttribute('aria-checked', v);
      }
    }
    const md = document.getElementById('md');
    if(openModalId && md && !md.contains(document.activeElement)){

// Repack at most once per frame: every WS tick used to force a synchronous
// layout of the whole grid.
let _packRaf = 0;
function schedulePack(){
  if(_packRaf) return;
  _packRaf = requestAnimationFrame(()=>{ _packRaf = 0; if(!resizing) packGrids(); });
}

// Reconnect with capped exponential backoff, and treat a socket that has gone
// quiet for 60 s as dead: a phone hopping WiFi->LTE leaves it half-open and the
// UI frozen on "online" otherwise.
let _wsDelay = 1000, _wsLast = 0, _wsWatch = 0, _wsRefused = 0;   // _wsRefused: closes before open in a row
function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(withToken(`${proto}://${location.host}/ws`));
  let opened = false;
  const retry = ()=>{
    clearInterval(_wsWatch);
    $('#conn').textContent=i18n('reconnecting\u2026'); $('#conn').classList.remove('live');
    // Refused before it ever opened: ask the API why. A 401 brings up the token prompt. If the
    // API answers, a restart would explain one or two misses; three in a row with a healthy API
    // mean the socket itself is refused -- an Origin the backend does not accept.
    if(!opened){
      _wsRefused++;
      api('/api/health').then(()=>{
        if(_wsRefused < 3) return;
        $('#conn').textContent = i18n('refused: see DASHBOARD_ORIGINS'); $('#conn').title = i18n('The live connection was refused although the token is valid: the page is opened under an address the backend does not accept (reverse proxy?). Set DASHBOARD_ORIGINS in .env.');
      }).catch(()=>{});
    }
    const wait = _wsDelay + Math.random() * 500;
    _wsDelay = Math.min(_wsDelay * 2, 30000);
    setTimeout(connectWS, wait);
  };
  ws.onopen  = ()=>{
    opened = true; _wsRefused = 0;
    $('#conn').textContent=i18n('online'); $('#conn').title = ''; $('#conn').classList.add('live');
    _wsDelay = 1000; _wsLast = Date.now();
    clearInterval(_wsWatch);
    _wsWatch = setInterval(()=>{
      if(Date.now() - _wsLast > 60000){
        // close() waits for a handshake a half-open socket never answers: detach and reconnect now
        ws.onclose = ws.onmessage = ws.onerror = null;
        try{ ws.close(); }catch(_){}
        retry();
      }
    }, 10000);
  };
  ws.onclose = retry;
  ws.onerror = ()=>{ try{ ws.close(); }catch(_){} };
  ws.onmessage = e =>{
    _wsLast = Date.now();
    const incoming = JSON.parse(e.data);
    const now = Date.now();
    for(const [k, info] of Object.entries(optimistic)){
      if(info.expires < now){ delete optimistic[k]; continue; }
      const slash = k.indexOf('/');
      const id = k.slice(0, slash), code = k.slice(slash+1);
      if(incoming[id]?.values) incoming[id].values[code] = info.value;
    }
    delete incoming._meta;
    STATE = incoming;
    updateCards();
    // card content changes height (sliders, statuses) -- repack,
    // but not in the middle of a gesture: repacking under the finger makes the tile jump
    schedulePack();
    if(openModalId) updateModal();
  };
}

  {id:'sensor',  label:i18n('Sensors'),     cats:['sensor']},

  {id:'auto',    label:i18n('Automations'), cats:[]},             // bindings view over buttons+sensors
  {id:'indicator', label:i18n('Indicators'), cats:['indicator'], compact:true},
  {id:'other',   label:i18n('Other'),   cats:[]},
];

let TAB_ORDER = {};   // {tabId:[device ids]} -- manual tile order on a tab
let TILE_SIZES = {};  // {scope:{dev:{w,h}}} -- resized tiles; scope = tab/room:<id>


function devsForTab(tabId){
  const tab = TABS.find(t => t.id === tabId) || TABS[0];
  // "Other" -- catch-all for anything not in other tabs (plus its own cats)
  let devs;
  if(tab.id === 'other'){
    const knownCats = new Set(TABS.filter(t=>t.id!=='other').flatMap(t=>t.cats));
    devs = DEVICES.filter(d => !knownCats.has(d.category));
  }else{
    devs = DEVICES.filter(d => tab.cats.includes(d.category));
  }
  return applyTabOrder(tab.id, devs);
}

// Manual tab order: the listed ones first, the rest after them as they were
function applyTabOrder(tabId, devs){
  const ord = TAB_ORDER[tabId];
  if(!Array.isArray(ord) || !ord.length) return devs;
  const pos = new Map(ord.map((id, i) => [id, i]));
  return devs.slice().sort((a, b) =>
    (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
}

let gridEditMode = false;   // "Order" on device grids (tabs and rooms)
let resizing = false;       // a gesture is in progress (resize/drag) -- do not repack

// Masonry for .grid.compact: 8px tracks (see CSS), the span is computed from the real
// content height of the card. Recomputed after render, on resize and on the WS tick
// (card content changes height, e.g. a brightness slider that appeared).
// Tile width in columns: explicit (resized), otherwise 1
function tileW(cd, scope, cols){
  const s = (TILE_SIZES[scope] || {})[cd.dataset.dev] || {};
  if(s.w) return Math.min(s.w, cols);
  return 1;
}

function packGrid(g){
  const rowH = 8, gap = GRID_GAP;
  const kids = Array.from(g.children);
  const cols = gridColCount(g);
  const scope = g.dataset.scope || activeTab;
  // two passes (otherwise every card = a relayout of the whole grid): first let every
  // card release its height -- align-self:start gives the box its natural content height,
  // a stretched box cannot be measured; then place them all in one go
  for(const cd of kids){
    // do NOT reset gridRowStart/End: the grid would then reflow automatically, its
    // height would drop and the browser would clip scrollTop -- the page jumps up on
    // every refresh. align-self:start already gives the natural height.
    cd.style.alignSelf = 'start';
  }
  const hs = kids.map(cd => cd.getBoundingClientRect().height);
  // we lay out ourselves: pinned ones (col) go to their column, the rest to the
  // shortest one; free[c] = the first free 8px track of column c
  const free = new Array(cols).fill(0);
  kids.forEach((cd, i) => {
    cd.style.alignSelf = '';
    const s = (TILE_SIZES[scope] || {})[cd.dataset.dev] || {};
    const w = tileW(cd, scope, cols);
    const spanRows = Math.max(1, Math.ceil((hs[i] + gap) / (rowH + gap)));
    let col;
    if(Number.isInteger(s.col) && s.col >= 0){
      col = Math.min(s.col, cols - w);
    }else{
      col = 0; let best = Infinity;
      for(let c = 0; c + w <= cols; c++){
        const m = Math.max(...free.slice(c, c + w));
        if(m < best){ best = m; col = c; }
      }
    }
    const row = Math.max(...free.slice(col, col + w));
    cd.style.gridColumnStart = String(col + 1);
    cd.style.gridColumnEnd = 'span ' + w;
    cd.style.gridRowStart = String(row + 1);
    cd.style.gridRowEnd = 'span ' + spanRows;
    for(let c = col; c < col + w; c++) free[c] = row + spanRows;
    cd.dataset.col = col;
    cd.dataset.colspan = w;
  });
}

function packGrids(){
  const sc = document.scrollingElement || document.documentElement;
  const y = sc.scrollTop;
  document.querySelectorAll('.grid.compact').forEach(packGrid);
  if(sc.scrollTop !== y) sc.scrollTop = y;
}

window.addEventListener('resize', ()=>{
  clearTimeout(window._packT);
  window._packT = setTimeout(packGrids, 120);
});

// Tile reorder mode: a shield over the card swallows clicks on its controls
// (otherwise dragging would flip switches), drag is on the card, the corner
// handle resizes.
function armGridDrag(cd, g, scope, persistOrder){
  cd.classList.add('editing');
  const shield = el('div');
  shield.style.cssText = 'position:absolute;inset:0;z-index:4';
  shield.onclick = ev => ev.stopPropagation();
  cd.append(shield);
  attachDragReorder(cd, '.card', (parent, info) => {
    if(g.classList.contains('compact') && info && info.x != null){
      dropIntoColumn(g, scope, cd, info.x, info.y, () => persistOrder(parent));
    }else{
      persistOrder(parent);
    }
  });
  attachResizer(cd, g, scope);
}

// Manual placement: a dropped tile is PINNED to the column under the pointer
// and placed vertically where it was dropped; unpinned ones keep finding their own place.
async function dropIntoColumn(g, scope, cd, x, y, persistOrder){
  const cols = gridColCount(g);
  const gr = g.getBoundingClientRect();
  const colW = (gr.width - (cols - 1) * GRID_GAP) / cols;
  const w = tileW(cd, scope, cols);
  const col = Math.max(0, Math.min(
    Math.floor((x - gr.left) / (colW + GRID_GAP)), cols - w));
  // position within the column: before its first tile whose centre is below the drop point
  const inCol = Array.from(g.children).filter(k => {
    if(k === cd) return false;
    const c0 = +k.dataset.col, cw = +k.dataset.colspan || 1;
    return c0 <= col && col < c0 + cw;
  }).sort((a, b) => (+a.style.gridRowStart || 0) - (+b.style.gridRowStart || 0));
  const before = inCol.find(k => {
    const r = k.getBoundingClientRect();
    return y < r.top + r.height / 2;
  });
  if(before) g.insertBefore(cd, before);
  else if(inCol.length) g.insertBefore(cd, inCol[inCol.length - 1].nextSibling);
  const s = (TILE_SIZES[scope] = TILE_SIZES[scope] || {})[cd.dataset.dev] || {};
  TILE_SIZES[scope][cd.dataset.dev] = {w: s.w || 0, h: s.h || 0, col};
  packGrid(g);
  persistOrder();
  try{
    await api('/api/tile_sizes/'+encodeURIComponent(scope), {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({device: cd.dataset.dev, w: s.w || 0, h: s.h || 0, col})
    });
  }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
}

const GRID_GAP = 10;

function gridColCount(g){
  return getComputedStyle(g).gridTemplateColumns.split(' ').length;
}

// Saved tile size: w in columns (clamped to what fits), h = min-height
function applyTileSize(cd, scope, dev, g){
  const s = (TILE_SIZES[scope] || {})[dev];
  if(!s) return;
  if(s.w) cd.style.gridColumn = 'span ' + Math.min(s.w, gridColCount(g));
  if(s.h) cd.style.minHeight = s.h + 'px';
}

function attachResizer(cd, g, scope){
  const rz = el('div','resizer','\u25e2');
  rz.title = i18n('Resize the tile; double-click for auto size');
  cd.append(rz);
  rz.ondblclick = async ev=>{
    ev.stopPropagation();
    cd.style.gridColumn = ''; cd.style.minHeight = '';
    if(TILE_SIZES[scope]) delete TILE_SIZES[scope][cd.dataset.dev];
    if(g.classList.contains('compact')) packGrid(g);
    try{
      await api('/api/tile_sizes/'+encodeURIComponent(scope), {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({device: cd.dataset.dev, w: 0, h: 0, col: -1})
      });
    }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
  };
  rz.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const pid = e.pointerId;
    const cols = gridColCount(g);
    const colW = (g.getBoundingClientRect().width - (cols-1)*GRID_GAP) / cols;
    const start = cd.getBoundingClientRect();
    let w = Math.max(1, Math.round((start.width + GRID_GAP) / (colW + GRID_GAP)));
    let h = Math.round(start.height);
    // leave the grid alone during the gesture (otherwise the tile jumps under the hand):
    // draw a ghost of the future size, apply once on release
    resizing = true;
    const ghost = el('div','rzghost');
    ghost.style.left = start.left + 'px';
    ghost.style.top = start.top + 'px';
    document.body.append(ghost);
    const draw = ()=>{
      ghost.style.width = (w*colW + (w-1)*GRID_GAP) + 'px';
      ghost.style.height = h + 'px';
      ghost.textContent = w + i18n(' qty \u00d7 ') + h + 'px';
    };
    draw();
    const move = ev=>{
      if(ev.pointerId !== pid) return;
      ev.preventDefault();
      w = Math.min(cols, Math.max(1, Math.round(
            (start.width + ev.clientX - e.clientX + GRID_GAP) / (colW + GRID_GAP))));
      h = Math.max(40, Math.round(start.height + ev.clientY - e.clientY));
      draw();
    };
    const up = async ev=>{
      if(ev.pointerId !== pid) return;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      resizing = false;
      ghost.remove();
      if(ev.type === 'pointercancel') return;
      cd.style.gridColumn = 'span ' + w;
      // height not above the natural one -- do not fix it (let the content decide)
      cd.style.minHeight = ''; cd.style.alignSelf = 'start';
      const nat = cd.getBoundingClientRect().height;
      cd.style.alignSelf = '';
      const hKeep = h > nat + 8 ? h : 0;
      if(hKeep) cd.style.minHeight = hKeep + 'px';
      if(g.classList.contains('compact')) packGrid(g);
      const prev = (TILE_SIZES[scope] || {})[cd.dataset.dev] || {};
      const col = Number.isInteger(prev.col) ? prev.col : -1;
      (TILE_SIZES[scope] = TILE_SIZES[scope] || {})[cd.dataset.dev] = {w, h: hKeep, col};
      try{
        await api('/api/tile_sizes/'+encodeURIComponent(scope), {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({device: cd.dataset.dev, w, h: hKeep, col})
        });
      }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

async function saveTabOrder(tabId, parent){
  const order = Array.from(parent.children).map(x => x.dataset.dev).filter(Boolean);
  TAB_ORDER[tabId] = order;
  try{
    await api('/api/tab_order/'+encodeURIComponent(tabId), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({order})
    });
  }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
}

  const del = document.createElement('button');
  del.className = 'dlg-btn danger';
  del.textContent = i18n('\u{1f5d1} Delete');
  del.onclick = async ()=>{
    if(!confirm(`${i18n('Delete room "')}${room.name}${i18n('"? The devices stay, only the group disappears.')}`)) return;
    try{
      await api('/api/rooms/'+encodeURIComponent(room.id), {method:'DELETE'});
    }catch(e){ alert(i18n('Error: ')+e.message); }
    activeTab = 'fav'; localStorage.setItem('home.tab','fav');
    await reloadRooms();
  };
  bar.append(add, ren, del);
  const devs = (room.devices||[]).map(id => BY_ID[id]).filter(Boolean)
  ;
  if(devs.length > 1){
    const ord = document.createElement('button');
    ord.className = 'dlg-btn' + (gridEditMode ? ' primary' : '');
    ord.textContent = gridEditMode ? i18n('Done') : i18n('\u270e Order');
    ord.onclick = ()=>{ gridEditMode = !gridEditMode; render(); };
    bar.append(ord);
  }
  app.append(bar);
  if(!devs.length){
    app.append(el('div','skeleton',i18n('\u2014 no devices in this room yet: "\uff0b Devices" \u2014')));
    return;
  }
  const g = document.createElement('div'); g.className='grid compact';
  g.dataset.scope = activeTab;
  for(const d of devs){
    const cd = card(d);
    cd.dataset.dev = d.id;
    if(gridEditMode) armGridDrag(cd, g, activeTab, async parent => {
      // visible order + the room's invisible (missing) members at the tail
      const visible = Array.from(parent.children).map(x => x.dataset.dev).filter(Boolean);
      const rest = (room.devices||[]).filter(id => !visible.includes(id));
      room.devices = visible.concat(rest);
      try{
        await api('/api/rooms/'+encodeURIComponent(room.id), {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({devices: room.devices})
        });
      }catch(e){ notifyFail(i18n('Not saved: ') + e.message); }
    });
    g.appendChild(cd);
  }
  app.append(g);
  for(const cd of g.children) applyTileSize(cd, activeTab, cd.dataset.dev, g);
  packGrid(g);
}

function openRoomPicker(rid){
  const room = roomById(rid); if(!room) return;
  const md = document.getElementById('md');
  const selected = new Set(room.devices || []);
  const pickable = DEVICES.slice().sort((a,b)=> (a.name||a.id).localeCompare(b.name||b.id, LANG));
  md.innerHTML = `
    <div class="head">
      <button class="closebtn" onclick="closeModal()">\u00d7</button>
      <h2>${i18n('Devices:')} ${escapeHtml(room.name)}</h2>
      <div class="sub">${i18n('Click devices to put them into the room. One device may be in several rooms.')}</div>
    </div>
    <div class="body">
      <section style="padding-top:0;border-top:0">
        <div class="picker-list">
          ${pickable.map(d=>{
            const others = ROOMS.filter(r => r.id !== rid && (r.devices||[]).includes(d.id)).map(r=>r.name);
            const on = selected.has(d.id);
            return `<div class="picker-dev">
                      <button class="picker-chan ${on?'active':''}" data-dev="${escapeHtml(d.id)}"
                              style="width:100%;text-align:left">
                        <span class="pick-mark">${on?'\u2713':'\uff0b'}</span> ${escapeHtml(d.name)}<span class="picker-meta"> \u00b7 ${escapeHtml(d.category||d.transport||'')}${others.length?i18n(' \u00b7 also in: ')+escapeHtml(others.join(', ')):''}</span>
                      </button>
                    </div>`;
          }).join('')}
        </div>
      </section>
      <section style="display:flex;gap:10px;justify-content:flex-end">
        <button id="room-pick-cancel" class="dlg-btn">${i18n('Cancel')}</button>
        <button id="room-pick-save" class="dlg-btn primary">${i18n('Save')}</button>
      </section>
    </div>`;
  document.getElementById('bd').classList.add('show');
  document.body.style.overflow = 'hidden';
  openModalId = '__room_picker__';
  md.querySelectorAll('[data-dev]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.dev;
      if(selected.has(id)) selected.delete(id); else selected.add(id);
      const on = selected.has(id);
      btn.classList.toggle('active', on);
      const mark = btn.querySelector('.pick-mark');
      if(mark) mark.textContent = on ? '\u2713' : '\uff0b';
    };
  });
  md.querySelector('#room-pick-cancel').onclick = ()=> closeModal();
  md.querySelector('#room-pick-save').onclick = async ()=>{
    // order: the previous membership (minus removed), then the newly added alphabetically
    const prev = (room.devices||[]).filter(id => selected.has(id));
    const added = pickable.map(d=>d.id).filter(id => selected.has(id) && !prev.includes(id));
    try{
      await api('/api/rooms/'+encodeURIComponent(room.id), {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({devices: prev.concat(added)})
      });
    }catch(e){ alert(i18n('Error: ')+e.message); return; }
    closeModal();
    await reloadRooms();
  };
}


// Central "Automations" tab -- one unified list over /api/rules (bindings +
// schedule + inching), with a guided WHEN -> IF -> THEN builder. Creation writes
// through the proven /api/bindings + /api/automation endpoints.
const ACT_LABELS = {on:i18n('On'), off:i18n('Off'), toggle:i18n('Toggle'),
                    bright_up:i18n('Brighter'), bright_down:i18n('Darker')};
const ACTIONS = [['on',i18n('On')],['off',i18n('Off')],['toggle',i18n('Toggle')],
                 ['bright_up',i18n('Brighter')],['bright_down',i18n('Darker')]];
const COND_OPS = [['<','<'],['>','>'],['<=','\u2264'],['>=','\u2265'],
                  ['==','='],['!=','\u2260'],['on',i18n('on')],['off',i18n('off')]];
const DOW = [i18n('Mon'),i18n('Tue'),i18n('Wed'),i18n('Thu'),i18n('Fri'),i18n('Sat'),i18n('Sun')];
const GESTURE_WORDS = {single: 'press', true: 'triggered', false: 'cleared', below: 'below threshold', above: 'above threshold'};
// human title of a rule, composed here so it follows the UI language (the server sends structure)
function ruleTitle(r){
  const w = (r.when && r.when[0]) || {}, t = (r.then && r.then[0]) || {};
  if(r.kind === 'binding'){
    const g = whenGesture(w.gesture);
    return `${w.device_name}: ${g} \u2192 ${t.device_name} ${ACT_LABELS[t.action] || t.action}` + (t.for ? ` ${i18n('for')} ${t.for}${i18n('s')}` : '');
  }
  if(r.kind === 'schedule'){
    const tm = (w.times && w.times[0]) || {}, days = tm.days || [];
    const dl = days.length === 7 ? '' : ' (' + days.map(d => DOW[d - 1]).join(',') + ')';
    return `${t.device_name}: ${i18n(t.action === 'on' ? 'on' : 'off')} ${i18n('at')} ${tm.time}${dl}`;
  }
  if(r.kind === 'inching') return `${t.device_name}: ${i18n('auto-off')} ${t.after}${i18n('s')} ${i18n('after turning on')}`;
  return r.title || r.id;
}
let RULES = [];

function buttonSources(){ return DEVICES.filter(d => controlsOf(d).trig_txt.length); }
function sensorSources(){ return DEVICES.filter(d => sensorBindControls(d, controlsOf(d)).length); }
function condDevices(){ return DEVICES.filter(d => { const C=controlsOf(d);
  return C.sensors.length || C.switches.length; }); }

// Chips are built from the rule's structure in the UI language; the server's English
// `label` is only the last resort for a shape this page does not know.
// a device category as a word of the UI language (the id itself is data: switch, sensor, ...)
function catLabel(c){ return c ? i18n('category:' + c).replace(/^category:/, '') : ''; }
function whenGesture(g){
  if(GESTURE_LABELS[g]) return GESTURE_LABELS[g];
  if(GESTURE_WORDS[g]) return i18n(GESTURE_WORDS[g]);
  return gestureLabel(g);
}
function whenChip(w){
  if(w.type === 'button') return `${escapeHtml(w.device_name)}: ${escapeHtml(whenGesture(w.gesture))}`;
  if(w.type === 'sensor'){
    const g = whenGesture(w.gesture);
    const t = (w.threshold!=null) ? ` ${g} ${w.threshold}` : ` ${g}`;
    return `${escapeHtml(w.device_name)}${escapeHtml(t)}`;
  }
  if(w.type === 'time'){
    const tm = (w.times && w.times[0]) || {}, days = tm.days || [];
    const dl = days.length === 7 ? '' : ' (' + days.map(d => DOW[d - 1]).join(',') + ')';
    return `\u23f0 ${escapeHtml((tm.time || w.label || '') + dl)}`;
  }
  if(w.type === 'state') return `${escapeHtml(w.device_name)} ${escapeHtml(i18n(w.label || ''))}`;
  return escapeHtml(i18n(w.label || ''));
}
function condChip(c){
  const op = (COND_OPS.find(o=>o[0]===c.op)||[])[1] || c.op;
  const dn = (BY_ID[c.device]||{}).name || c.device;
  return (c.op==='on'||c.op==='off') ? `${escapeHtml(dn)} ${escapeHtml(op)}`
                                     : `${escapeHtml(dn)} ${escapeHtml(op)} ${escapeHtml(String(c.value))}`;
}
function thenChip(t){
  let act = t.after!=null ? `${i18n('off after')} ${t.after}${i18n('s')}`
          : (ACT_LABELS[t.action]||t.action);
  if(t.for) act += ` ${i18n('for')} ${t.for}${i18n('s')}`;
  return `${escapeHtml(t.device_name)} ${escapeHtml(act)}`;
}
function ruleFlowHtml(r){
  let h = r.when.map(w=>`<span class="rule-chip when">${whenChip(w)}</span>`).join('');
  for(const c of (r.conditions||[]))
    h += `<span class="rule-arrow">\u00b7</span><span class="rule-chip cond">${condChip(c)}</span>`;
  if(r.time_window){
    const tw = r.time_window;
    h += `<span class="rule-arrow">\u00b7</span><span class="rule-chip cond">\u{1f551} ${
      escapeHtml(tw.from)}\u2013${escapeHtml(tw.to)}</span>`;
  }
  h += `<span class="rule-arrow">\u2192</span>` +
       r.then.map(t=>`<span class="rule-chip then">${thenChip(t)}</span>`).join('');
  return h;
}

async function renderAutomations(app, keepScroll){
  const y = window.scrollY;
  if(!keepScroll) app.innerHTML = '<div class="skeleton">' + i18n('Loading\u2026') + '</div>';
  try { RULES = await api('/api/rules'); } catch(e){ RULES = []; }
  if(activeTab !== 'auto') return;   // switched away while loading: do not draw into another tab
  renderTabs();                      // the tab badge counts rules: show the fresh number now
  const wrap = el('div','auto-wrap');
  const tb = el('div','auto-toolbar');
  tb.innerHTML = `<div style="color:var(--dim);font-size:13px">${RULES.length} ${
    i18nPlural('rule', RULES.length)}</div>
    <div style="display:flex;gap:8px">
    <button class="addbtn" style="width:auto;margin:0;padding:10px 16px" id="rb-new">${i18n('\uff0b Add')}</button></div>`;
  wrap.append(tb);
  if(!RULES.length){
    wrap.append(el('div','auto-empty',
      i18n('No automations yet.') + '<br>' + i18n('Press "\uff0b Add" to create the first one:') + '<br>'+
      '<i>' + i18n('when something happened \u2192 (if a condition holds) \u2192 do an action.') + '</i>'));
  } else {
    for(const r of RULES) wrap.append(ruleCard(r));
  }
  app.innerHTML = ''; app.append(wrap);
  document.getElementById('rb-new').onclick = ()=> openRuleBuilder(null);
  if(keepScroll) window.scrollTo(0, y);   // enable/delete redraws in place, no jump to the top
}


function ruleCard(r){
  const c = el('div','rule-card'+(r.enabled?'':' off'));
  c.innerHTML = `
    <div class="rule-main">
      <div class="rule-title">${escapeHtml(ruleTitle(r))}<span class="rule-kind">${
        {binding:i18n('trigger'),schedule:i18n('schedule'),inching:i18n('auto-off')}[r.kind]||''}</span></div>
      <div class="rule-flow">${ruleFlowHtml(r)}</div>
    </div>
    <div class="rule-actions">
      <div class="rule-actions-top">
        <button class="rule-run" title="${i18n('Run the action now')}">\u25b6</button>
        <div class="toggle ${r.enabled?'on':''}" title="${i18n('enable/disable the rule')}"></div>
      </div>
      <button class="rule-del" title="${i18n('Delete')}">\u00d7</button>
    </div>`;
  c.querySelector('.rule-main').onclick = ()=> openRuleBuilder(r);
  c.querySelector('.rule-run').onclick = async (e)=>{
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true; const prev = btn.textContent; btn.textContent = '\u2026';
    try{
      await api('/api/rules/run', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:r.id})});
      btn.textContent = '\u2713';
      setTimeout(()=>{ btn.textContent = prev; btn.disabled = false; }, 900);
    }catch(err){
      btn.textContent = prev; btn.disabled = false;
      alert(i18n('Error: ')+err.message);
    }
  };
  c.querySelector('.toggle').onclick = async (e)=>{
    e.stopPropagation();
    const on = !c.querySelector('.toggle').classList.contains('on');
    try{
      await api('/api/rules/enable', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id:r.id, enabled:on})});
      renderAutomations($('#app'), true);
    }catch(err){ alert(i18n('Error: ')+err.message); }
  };
  c.querySelector('.rule-del').onclick = async (e)=>{
    e.stopPropagation();
    if(!confirm(i18n('Delete the rule?\n')+ruleTitle(r))) return;
    try{
      await api('/api/rules/delete', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:r.id})});
      renderAutomations($('#app'), true);
    }catch(err){ alert(i18n('Error: ')+err.message); }
  };
  return c;
}

// ---------- Rule builder (WHEN -> IF -> THEN) ----------
function optsHtml(pairs, sel){
  return pairs.map(([v,l])=>`<option value="${escapeHtml(String(v))}"${
    String(v)===String(sel)?' selected':''}>${escapeHtml(l)}</option>`).join('');
}
function devOpts(list, sel){
  return optsHtml(list.map(d=>[d.id, d.name]), sel);
}
function switchTargetOpts(sel){ return devOpts(switchTargetsList(), sel); }
function codeOptsFor(devId, kinds, sel){
  const d = BY_ID[devId]; if(!d) return '';
  const cs = (d.controls||[]).filter(c=>kinds.includes(c.kind));
  return optsHtml(cs.map(c=>[c.code, c.label||c.code]), sel);
}
function daysPickerHtml(sel){
  const s = sel || [1,2,3,4,5,6,7];
  return `<div class="rb-days">`+DOW.map((n,i)=>
    `<button type="button" class="rb-day${s.includes(i+1)?' on':''}" data-d="${i+1}">${n}</button>`
  ).join('')+`</div>`;
}

function openRuleBuilder(rule){
  openModalId = '__rule_builder__';
  const edit = !!rule;
  // derive initial trigger type from an existing rule
  let ttype = 'button';
  if(edit){
    const w = rule.when[0];
    ttype = w.type === 'sensor' ? 'sensor' : w.type === 'time' ? 'time'
          : w.type === 'state' ? 'deviceon' : 'button';
  }
  const md = document.getElementById('md');
  md.innerHTML = `
    <div class="head">
      <button class="closebtn" onclick="closeModal()">\u00d7</button>
      <h2>${edit?i18n('Edit'):i18n('New')} ${i18n('automation')}</h2>
    </div>
    <div class="body">
      <div class="rb-step"><h4>${i18n('When')}</h4>
        <div class="rb-row"><label>${i18n('Event')}</label>
          <select id="rb-ttype">
            <option value="button">${i18n('Button pressed')}</option>
            <option value="sensor">${i18n('Sensor triggered')}</option>
            <option value="time">${i18n('Time reached')}</option>
            <option value="deviceon">${i18n('Device turned on')}</option>
          </select></div>
        <div id="rb-tfields"></div>
      </div>
      <div class="rb-step" id="rb-condstep"><h4>${i18n('If (optional)')}</h4>
        <div id="rb-conds"></div>
        <button type="button" id="rb-addcond" class="rb-day" style="width:auto;padding:6px 12px">${i18n('\uff0b condition')}</button>
        <div id="rb-twin" style="margin-top:12px"></div>
      </div>
      <div class="rb-step"><h4>${i18n('Then')}</h4><div id="rb-afields"></div></div>
      <div id="rb-msg" style="color:var(--bad);min-height:18px;margin:6px 2px"></div>
      <button class="addbtn" id="rb-save">${edit?i18n('Save'):i18n('Create')}</button>
    </div>`;
  document.getElementById('bd').classList.add('show');
  document.body.style.overflow = 'hidden';

  const tsel = document.getElementById('rb-ttype');
  tsel.value = ttype;
  tsel.onchange = ()=>{ rbTriggerFields(tsel.value, null); rbActionFields(tsel.value, null);
                        rbToggleCond(tsel.value); };
  rbTriggerFields(ttype, edit?rule:null);
  rbActionFields(ttype, edit?rule:null);
  rbToggleCond(ttype);
  rbRenderConds(edit ? (rule.conditions||[]) : []);
  rbRenderTimeWindow(edit ? rule.time_window : null);
  document.getElementById('rb-addcond').onclick = ()=> rbAddCondRow({});
  document.getElementById('rb-save').onclick = ()=> rbSave(edit ? rule : null);
}

function rbToggleCond(type){
  document.getElementById('rb-condstep').style.display =
    (type==='button'||type==='sensor') ? '' : 'none';
}

function rbTriggerFields(type, rule){
  const box = document.getElementById('rb-tfields');
  const w = rule ? rule.when[0] : null;
  if(type==='button'){
    box.innerHTML = `<div class="rb-row"><label>${i18n('Button')}</label>
        <select id="rb-bdev">${devOpts(buttonSources(), w?w.device:'')}</select>
        <select id="rb-bgest"></select></div>`;
    const dsel = document.getElementById('rb-bdev');
    const rebuild = ()=>{
      const d = BY_ID[dsel.value]; const C = d?controlsOf(d):{trig_txt:[]};
      const opts = [];
      for(const t of C.trig_txt){
        const gs = (t.values||[]).filter(v=>v==='single'||/_single$/.test(v));
        for(const g of gs) opts.push([`${t.code}|${g}`, gestureLabel(g)]);
      }
      document.getElementById('rb-bgest').innerHTML = optsHtml(opts,
        w ? `${w.code}|${w.gesture}` : '');
    };
    dsel.onchange = rebuild; rebuild();
  } else if(type==='sensor'){
    box.innerHTML = `<div class="rb-row"><label>${i18n('Sensor')}</label>
        <select id="rb-sdev">${devOpts(sensorSources(), w?w.device:'')}</select>
        <select id="rb-scode"></select></div>
      <div class="rb-row"><label>${i18n('When')}</label>
        <select id="rb-sedge"></select>
        <input id="rb-sthr" type="number" step="any" placeholder="${i18n('limit')}" style="width:90px;display:none">
        <input id="rb-shyst" type="number" step="any" placeholder="${i18n('hyst.')}" style="width:80px;display:none"></div>`;
    const dsel = document.getElementById('rb-sdev');
    const rebuildCode = ()=>{
      const d = BY_ID[dsel.value]; const C = d?controlsOf(d):{};
      const ss = d ? sensorBindControls(d, C) : [];
      document.getElementById('rb-scode').innerHTML =
        optsHtml(ss.map(s=>[s.code, s.label||s.code]), w?w.code:'');
      rebuildEdge();
    };
    const rebuildEdge = ()=>{
      const d = BY_ID[dsel.value]; const C = d?controlsOf(d):{};
      const code = document.getElementById('rb-scode').value;
      const s = (d?sensorBindControls(d,C):[]).find(x=>x.code===code) || {};
      const numeric = s.vtype === 'num';
      const edges = numeric ? [['below',i18n('went below')],['above',i18n('went above')]]
                            : [['true',i18n('triggered')],['false',i18n('cleared')]];
      document.getElementById('rb-sedge').innerHTML = optsHtml(edges, w?w.gesture:'');
      const showThr = numeric;
      document.getElementById('rb-sthr').style.display = showThr?'':'none';
      document.getElementById('rb-shyst').style.display = showThr?'':'none';
      if(w && w.threshold!=null) document.getElementById('rb-sthr').value = w.threshold;
      if(w && w.hyst!=null) document.getElementById('rb-shyst').value = w.hyst;
    };
    dsel.onchange = rebuildCode;
    document.getElementById('rb-scode').onchange = rebuildEdge;
    rebuildCode();
  } else if(type==='time'){
    const times = (w&&w.times&&w.times[0]) ? w.times[0] : {time:'08:00', days:[1,2,3,4,5,6,7]};
    box.innerHTML = `<div class="rb-row"><label>${i18n('Time')}</label>
        <input id="rb-time" type="time" value="${times.time||'08:00'}"></div>
      <div class="rb-row"><label>${i18n('Days')}</label>${daysPickerHtml(times.days)}</div>`;
    box.querySelectorAll('.rb-day').forEach(b=> b.onclick=()=>b.classList.toggle('on'));
  } else if(type==='deviceon'){
    const dev = rule ? rule.then[0].device : '';
    const code = rule ? rule.then[0].code : '';
    box.innerHTML = `<div class="rb-row"><label>${i18n('Device')}</label>
        <select id="rb-odev">${switchTargetOpts(dev)}</select>
        <select id="rb-ocode">${codeOptsFor(dev||switchTargetsList()[0]?.id, ['switch'], code)}</select></div>
      <div class="bindcaption">${i18n('fires whenever this channel turns on')}</div>`;
    const dsel = document.getElementById('rb-odev');
    dsel.onchange = ()=>{ document.getElementById('rb-ocode').innerHTML =
        codeOptsFor(dsel.value, ['switch'], ''); };
  }
}

function rbActionFields(type, rule){
  const box = document.getElementById('rb-afields');
  if(type==='deviceon'){
    const after = rule ? (rule.then[0].after||5) : 5;
    box.innerHTML = `<div class="rb-row"><label>${i18n('Auto-off after')}</label>
        <input id="rb-after" type="number" min="1" value="${after}" style="width:90px"> ${i18n('sec')}</div>`;
    return;
  }
  const t = rule ? rule.then[0] : null;
  const acts = (type==='time') ? [['on',i18n('On')],['off',i18n('Off')]] : ACTIONS;
  const forHtml = (type==='time') ? '' : `
    <div class="rb-row"><label>${i18n('Duration')}</label>
      <input id="rb-for" type="number" min="0" placeholder="${i18n('0 = permanently')}"
             style="width:130px" value="${t&&t.for?t.for:''}"> ${i18n('sec')}
      <select id="rb-retrig" style="display:none">
        <option value="restart">${i18n('restart')}</option>
        <option value="extend">${i18n('extend')}</option>
        <option value="ignore">${i18n('ignore')}</option>
      </select></div>
    <div class="bindcaption" id="rb-forcap" style="display:none">
      ${i18n('turns on and reverts after N seconds (a repeated trigger follows the rule)')}</div>`;
  box.innerHTML = `<div id="rb-adev">
      <div class="rb-row"><label>${i18n('Device')}</label>
        <select id="rb-atgt">${switchTargetOpts(t?t.device:'')}</select>
        <select id="rb-acode"></select></div>
      <div class="rb-row"><label>${i18n('Action')}</label>

async function rbSave(editRule){
  const msg = document.getElementById('rb-msg'); msg.textContent='';
  const type = document.getElementById('rb-ttype').value;
  // An edit writes the new rule FIRST and removes the old one only after that
  // succeeded (and only if it is a different rule): a rejected form loses nothing.
  let newId = null;
  try{
    if(type==='button' || type==='sensor'){
      let body;
      {
        const tgt = document.getElementById('rb-atgt').value;
        const tcode = document.getElementById('rb-acode').value;
        const action = document.getElementById('rb-aact').value;
        if(!tgt||!tcode) throw new Error(i18n('pick the target device'));
        body = {target:tgt, code:tcode, action, conditions: rbReadConds()};
        const forEl = document.getElementById('rb-for');
        const forv = forEl ? +(forEl.value||0) : 0;
        if(forv>0 && (action==='on'||action==='off')){
          body.for_sec = forv;
          body.retrigger = document.getElementById('rb-retrig').value;
        }
      }
      const tw = rbReadTimeWindow();
      if(tw) body.time_window = tw;
      let src, scode, gest;
      if(type==='button'){
        src = document.getElementById('rb-bdev').value;
        [scode, gest] = document.getElementById('rb-bgest').value.split('|');
      } else {
        src = document.getElementById('rb-sdev').value;
        scode = document.getElementById('rb-scode').value;
        gest = document.getElementById('rb-sedge').value;
        if(gest==='below'||gest==='above'){
          const thr = document.getElementById('rb-sthr').value;
          if(thr==='') throw new Error(i18n('enter a limit'));
          body.threshold = +thr;
          const h = document.getElementById('rb-shyst').value;
          if(h!=='') body.hyst = +h;
        }
      }
      if(!src||!gest) throw new Error(i18n('pick a trigger'));
      newId = `b|${src}|${scode}|${gest}`;
      await api(`/api/bindings/${encodeURIComponent(src)}/${encodeURIComponent(scode)}/${encodeURIComponent(gest)}`,
        {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    } else if(type==='time'){
      const dev = document.getElementById('rb-atgt').value;
      const code = document.getElementById('rb-acode').value;
      const action = document.getElementById('rb-aact').value;
      const time = document.getElementById('rb-time').value;
      if(!dev||!code||!time) throw new Error(i18n('fill in the device and the time'));
      const days = [...document.querySelectorAll('#rb-tfields .rb-day.on')].map(b=>+b.dataset.d);
      if(!days.length) throw new Error(i18n('pick at least one day'));
      const cur = await api(`/api/automation/${encodeURIComponent(dev)}/${encodeURIComponent(code)}`); // no fallback: posting an empty list would wipe the channel's schedule
      // editing a row of this same channel: replace it in one write instead of delete + add
      const old = editRule && editRule.id.startsWith(`a|${dev}/${code}|sched|`) ? editRule.id.split('|') : null;
      const rest = (cur.schedule||[]).filter(r => !(old && r.time === old[3] && (r.action||'on') === old[4]));
      const sched = rest.concat([{time, days, action}]);
      newId = old ? editRule.id : `a|${dev}/${code}|sched|${time}|${action}`;
      await api(`/api/automation/${encodeURIComponent(dev)}/${encodeURIComponent(code)}`,
        {method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({inching_sec:cur.inching_sec||0, schedule:sched})});
    } else if(type==='deviceon'){
      const dev = document.getElementById('rb-odev').value;
      const code = document.getElementById('rb-ocode').value;
      const after = +document.getElementById('rb-after').value;
      if(!dev||!code||!(after>0)) throw new Error(i18n('fill in the device and the time'));
      newId = `a|${dev}/${code}|inch`;
      const cur = await api(`/api/automation/${encodeURIComponent(dev)}/${encodeURIComponent(code)}`); // no fallback: posting an empty list would wipe the channel's schedule
      await api(`/api/automation/${encodeURIComponent(dev)}/${encodeURIComponent(code)}`,
        {method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({inching_sec:after, schedule:cur.schedule||[]})});
    }
    if(editRule && editRule.id !== newId){
      await api('/api/rules/delete', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:editRule.id})});
    }
    closeModal();
    activeTab = 'auto'; localStorage.setItem('home.tab','auto');
    renderTabs(); render();
  }catch(e){ msg.textContent = i18n('Error: ')+e.message; }
}

  }else{
    const btns = favEditMode
      ? `<button id="fav-add" class="primary">${i18n('\uff0b Add')}</button>
         <button id="fav-edit" class="active">${i18n('Done')}</button>`
      : `<button id="fav-add" class="primary">${i18n('\uff0b Add')}</button>
         <button id="fav-edit">${i18n('\u270e Order')}</button>

  }
  app.append(tb);
  if(!FAVORITES.length){
    app.append(el('div','fav-empty',i18n('Empty so far. Press "\uff0b Add" to pick channels.')));
  }else{
    const g = el('div','fav-grid');
    FAVORITES.forEach(f => g.appendChild(favCard(f)));

  }
  if(favDeleteMode){
    document.getElementById('fav-del-cancel').onclick = ()=>{
      favDeleteMode = false; favSelected.clear(); render();
    };

    if(go) go.onclick = async ()=>{
      const targets = FAVORITES.filter(f => favSelected.has(`${f.device}/${f.code}`));
      const gone = new Set();
      for(const f of targets){
        try{
          await api(`/api/favorites/${encodeURIComponent(f.device)}/${encodeURIComponent(f.code)}`, {method:'DELETE'});
          gone.add(`${f.device}/${f.code}`);
        }catch(e){ notifyFail(i18n('Could not remove from favourites: ') + e.message); }
      }
      FAVORITES = FAVORITES.filter(f => !gone.has(`${f.device}/${f.code}`));
      favDeleteMode = false; favSelected.clear();
      renderTabs(); render();
    };
    return;
  }
  document.getElementById('fav-add').onclick = ()=> openPicker();
  document.getElementById('fav-edit').onclick = ()=>{
    favEditMode = !favEditMode; render();
  };
  const delBtn = document.getElementById('fav-del');
  if(delBtn) delBtn.onclick = ()=>{
    favDeleteMode = true; favEditMode = false; favSelected.clear(); render();
  };

function favCard(f){
