# zigbee2mqtt, merged into the core's compose through COMPOSE_FILE (paths relative to the checkout).
# Runs only with COMPOSE_PROFILES containing zigbee, which setup/secrets.sh keeps in step with Z2M_SERIAL.
services:
  zigbee2mqtt:
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # built here or pinned: an updater must not pull or replace it
    image: koenkk/zigbee2mqtt:2.12.0
    restart: unless-stopped
    profiles: ["zigbee"]
    mem_limit: 512m
    environment:
      - TZ=${TZ:-UTC}
      - ZIGBEE2MQTT_CONFIG_FRONTEND_BASE_URL=/plugins/zigbee/ui   # its page goes through the dashboard's port (no port of its own)
    devices:
      # Z2M_DEVICE (secrets.sh): the stick, /dev/null for a tcp:// coordinator; a .env from before it: the stick
      - "${Z2M_DEVICE:-${Z2M_SERIAL:-/dev/null}}:/dev/ttyUSB0"
    volumes:
      - ${Z2M_DATA_DIR:?Z2M_DATA_DIR is empty - run make update}:/app/data
      - /run/udev:/run/udev:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/plugins/zigbee/ui/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      - mosquitto
