# zigbee2mqtt, merged into the core's compose through COMPOSE_FILE (paths relative to the checkout).
# Runs only with COMPOSE_PROFILES containing zigbee, which setup/secrets.sh keeps in step with Z2M_SERIAL.
services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.12.0
    restart: unless-stopped
    profiles: ["zigbee"]
    mem_limit: 512m
    environment:
      - TZ=${TZ:-UTC}
    devices:
      - "${Z2M_SERIAL:-/dev/null}:/dev/ttyUSB0"
    volumes:
      - ${Z2M_DATA_DIR:?Z2M_DATA_DIR is empty - run make update}:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "${Z2M_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      - mosquitto
