# Shared base for an ESPHome node: Wi-Fi with the fallback AP "${name}-setup", captive portal, MQTT.
# Include as `packages: {base: !include provision/base.yaml}`; the node's own keys win on merge.
# secrets.yaml keys: wifi_ssid, wifi_password, ap_password, mqtt_host, mqtt_user, mqtt_password.
# ap_password = the house's PANELS_AP_PASSWORD (the panels' setup-AP key): recovery then needs no typing.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-setup"
    password: !secret ap_password

captive_portal:

# safe mode runs only Wi-Fi and OTA; leave it after 2 min
safe_mode:
  reboot_timeout: 2min

logger:

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  topic_prefix: ${name}
