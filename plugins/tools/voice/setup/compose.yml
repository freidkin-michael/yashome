# tts, merged into the core's compose through COMPOSE_FILE (paths relative to the checkout).
# Runs only with COMPOSE_PROFILES containing voice. The Silero models (CC BY-NC-SA 4.0: non-commercial use only) are downloaded once into the docker volume voice-models.
services:
  tts:
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # built here: an updater must not pull or replace it
    build:
      context: plugins/tools/voice
      dockerfile: service/tts/Dockerfile
    restart: unless-stopped
    init: true                  # tini as PID 1 hands SIGTERM to python: no 10 s wait, no exit 137 at an update
    stop_grace_period: 3s
    profiles: ["voice"]
    user: "${PUID:-1000}:${PGID:-1000}"
    mem_limit: 2g                                 # torch with two models: about 1.1g
    environment:
      - VOICE_TTS_KEY=${VOICE_TTS_KEY:-}
      - HOME=/tmp
    tmpfs:
      - /data:uid=${PUID:-1000},gid=${PGID:-1000}
    volumes:
      - voice-models:/models                          # a named volume: docker would make a host folder root-owned and the plug-in could not write beside it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
volumes:
  voice-models:
