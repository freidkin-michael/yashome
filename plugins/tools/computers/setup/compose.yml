# computers-discover, merged into the core's compose through COMPOSE_FILE (paths relative to the checkout).
# It needs the host's network: a broadcast from the dashboard's bridge network reaches no computer.
services:
  computers-discover:
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # built here or pinned: an updater must not pull or replace it
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    mem_limit: 32m
    command: ["python3", "-u", "/discover/discoverd.py"]
    environment:
      - STATE_DIR=/state
      - TZ=${TZ:-UTC}
    volumes:
      - ./plugins/tools/computers/discover:/discover:ro
      - ${HOUSE_DIR:-.}/plugin-state/computers:/state
